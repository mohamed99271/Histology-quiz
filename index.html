<style>
:root {
  color-scheme:light;
  --bg:#f2f5fa;
  --paper:#ffffff;
  --text:#263747;
  --heading:#245e7f;
  --muted:#5b6c7c;
  --line:#d5dce5;
  --good:#168052;
  --bad:#b73545;
  --blue-soft:#edf5fa;
}
* {box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.55}
.wrap{max-width:790px;margin:0 auto;padding:34px 16px 76px}
.header{text-align:center;margin:0 auto 24px}
.header h1{margin:0;color:var(--heading);font-size:clamp(1.75rem,6vw,2.65rem);font-weight:760;line-height:1.25;letter-spacing:-.7px}
.header .brand{display:block;color:var(--heading);font-size:clamp(1.36rem,4.8vw,2rem);font-weight:680;margin-top:12px}.scope-tag{font-weight:650;color:#4c7489;font-size:.85rem;margin-top:8px;letter-spacing:.5px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:17px;padding:20px;margin:10px 0 14px}
.welcome{display:flex;align-items:center;justify-content:center;text-align:center;min-height:68px;font-size:1.23rem;font-weight:620;margin-bottom:14px}
.chapters{display:grid;gap:10px}
.chapter{appearance:none;display:block;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:17px;padding:18px 17px;color:var(--text);text-align:left;direction:ltr;cursor:pointer;line-height:1.33;min-height:105px;font:inherit;box-shadow:none;transition:background-color .13s,border-color .13s}
.chapter:focus-visible,.chapter:hover{border-color:#79a8c5;background:#fafcfe;outline:none}
.chapter strong{display:block;font-size:1.2rem;font-weight:660;margin-bottom:7px;overflow-wrap:anywhere}
.chapter small{display:block;font-size:1rem;color:#3b4855;font-weight:400;line-height:1.45}
.chapter.comprehensive{border-color:#aac7da;background:#fafdff}
.chapter.comprehensive strong{color:var(--heading)}
.note{text-align:center;font-size:.92rem;color:var(--muted);margin:14px 0 10px}
.quiz-card{padding:21px 18px 19px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:.93rem}
.topline .kind{background:#eaf3f8;color:#215f81;padding:4px 10px;border-radius:10px;font-weight:700}
.topline .counter{font-weight:760;color:var(--heading)}
.progress{height:7px;background:#dde5ed;border-radius:99px;margin:15px 0 14px;overflow:hidden}
.progress div{height:100%;background:#2b779e;border-radius:99px;transition:width .15s}
.chapter-label{font-size:.86rem;color:var(--muted);direction:ltr;text-align:left;margin:12px 0}
.q{direction:ltr;text-align:left;font-size:1.15rem;font-weight:700;margin:12px 0 20px;line-height:1.62;overflow-wrap:anywhere;white-space:pre-line}
.answer{direction:ltr;text-align:left;display:flex;gap:10px;align-items:flex-start;width:100%;padding:12px 14px;margin:9px 0;background:#fff;color:var(--text);border:1.5px solid var(--line);border-radius:11px;cursor:pointer;font:inherit;line-height:1.5;overflow-wrap:anywhere;min-height:52px}
.answer .letter{font-weight:800;color:var(--heading);min-width:19px}
.answer:hover,.answer:focus-visible{border-color:#82b2d0;background:#f6fbfe;outline:none}

.answer.correct{border-color:#168052;background:#e0f7e9;color:#115b38;box-shadow:inset 0 0 0 1px #168052;font-weight:700}
.answer.wrong{border-color:#b73545;background:#ffe9eb;color:#8a2331;box-shadow:inset 0 0 0 1px #b73545;font-weight:700}
.answer.correct .letter{color:#115b38}.answer.wrong .letter{color:#8a2331}
.answer:disabled{opacity:1;cursor:default}.answer:disabled:hover{background:#fff;border-color:var(--line)}
.answer.correct:disabled:hover{background:#e0f7e9;border-color:#168052}
.answer.wrong:disabled:hover{background:#ffe9eb;border-color:#b73545}
.feedback{margin-top:15px;padding:14px 15px;border-radius:11px;border:1.5px solid #addabd;background:#ecf8f0;line-height:1.65}
.feedback.bad{background:#fff1f1;border-color:#efb0bb}
.feedback h3{margin:0 0 6px;color:#176c45;font-size:1.08rem}
.feedback.bad h3{color:#b73545}
.feedback .correct-text{direction:ltr;text-align:left;font-weight:640;overflow-wrap:anywhere}
.feedback .exp{direction:ltr;text-align:left;color:var(--muted);font-size:.91rem;line-height:1.7;white-space:pre-line;margin-top:8px}

.actions{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:21px;flex-wrap:wrap}
.btn{background:var(--heading);color:#fff;border:1.5px solid var(--heading);border-radius:10px;padding:11px 17px;font:inherit;font-weight:700;cursor:pointer;min-height:46px}
.btn.alt{background:#fff;color:var(--heading);border-color:#b4c9d8}
.btn:disabled{opacity:.42;cursor:default}
.btn:focus-visible{outline:3px solid #99c7e1;outline-offset:2px}
.btn.secondary-action{background:#eef5fa;color:var(--heading);border-color:#d0e1ec}
.result h2{text-align:center;margin:0 0 14px;font-size:1.5rem;color:var(--heading)}
.result .score{text-align:center;color:var(--heading);font-size:2.7rem;font-weight:800;line-height:1.2}
.result .percent{text-align:center;font-weight:700;font-size:1.3rem;margin-top:4px}
.result .message{text-align:center;font-size:1.07rem;font-weight:650;line-height:1.75;margin:13px 0}
.result .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:17px 0 4px}
.result .stats>div{text-align:center;background:#f4f7fa;border:1px solid #e0e7ef;border-radius:10px;padding:10px 8px}
.result .stats strong{font-size:1.4rem;display:block}
.result .stats .good{color:var(--good)}.result .stats .bad{color:var(--bad)}
.result .guidance{margin:15px 0;padding:12px;border-radius:10px;background:#f1f7fb;line-height:1.8}
.result .buttons{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.review h3{text-align:center;font-size:1.1rem;margin:0 0 8px;color:var(--heading)}
.mistake{border-top:1px solid var(--line);padding:15px 0 12px;direction:ltr;text-align:left}
.mistake .ref{color:var(--muted);font-size:.83rem}
.mistake strong{display:block;margin:6px 0 8px;overflow-wrap:anywhere;white-space:pre-line}
.mistake .wrong{color:var(--bad)}.mistake .correct{color:var(--good)}
.mistake div{margin-top:4px;overflow-wrap:anywhere}
.mistake details{font-size:.9rem;line-height:1.7;color:var(--muted);margin-top:7px}
.mistake details>div{white-space:pre-wrap;color:var(--text)}
.footer{text-align:center;margin-top:22px;color:var(--muted);font-size:.77rem}
@media(max-width:520px){.wrap{padding:30px 15px 62px}.header{margin:0 auto 26px}.header h1{font-size:1.9rem}.header .brand{font-size:1.51rem;margin-top:9px}.chapter{padding:17px 14px;min-height:101px}.chapter strong{font-size:1.08rem}.chapter small{font-size:.95rem}.card{padding:18px}.welcome{font-size:1.15rem;min-height:68px}.q{font-size:1.06rem}.quiz-card{padding:18px 15px}.answer{padding:12px 11px}.actions .btn{flex:1 1 auto}}
</style>

const BANK=[{"id":1,"title":"Anatomy of Male & Female Genital System","questions":[{"id":"C1-MCQ-01","type":"mcq","sourceNumber":1,"question":"Which of the following is considered the primary sex organ in males?","options":["Epididymis","Prostate gland","Testis","Seminal vesicle"],"answer":2,"explanation":""},{"id":"C1-MCQ-02","type":"mcq","sourceNumber":2,"question":"Commonly, the left testicle lies:","options":["Lower than the right","Higher during rest but lower during activity","Slightly higher than the right","At the same scrotal level as the right"],"answer":0,"explanation":""},{"id":"C1-MCQ-03","type":"mcq","sourceNumber":3,"question":"Each compartment (lobe) of the testis lodges:","options":["3-5 seminiferous tubules","2-3 seminiferous tubules","1-2 seminiferous tubules","5-8 seminiferous tubules"],"answer":1,"explanation":""},{"id":"C1-MCQ-04","type":"mcq","sourceNumber":4,"question":"Spermatozoa are stored and matured in the:","options":["Seminal vesicles","Prostate gland","Epididymis","Vas deferens"],"answer":2,"explanation":""},{"id":"C1-MCQ-05","type":"mcq","sourceNumber":5,"question":"The epididymis is anatomically situated on which aspect of each testicle?","options":["Anterolateral","Posterolateral","Anteromedial","Inferior"],"answer":1,"explanation":""},{"id":"C1-MCQ-06","type":"mcq","sourceNumber":6,"question":"The epididymis is formed of which of the following parts?","options":["Head, body, and tail","Head, body, and neck","Body, neck, and tail","Head, neck, and tail"],"answer":0,"explanation":""},{"id":"C1-MCQ-07","type":"mcq","sourceNumber":7,"question":"The vas deferens is the direct continuation of the:","options":["Head of the epididymis","Body of the epididymis","Tail of the epididymis","Seminiferous tubules"],"answer":2,"explanation":""},{"id":"C1-MCQ-08","type":"mcq","sourceNumber":8,"question":"The ejaculatory duct is formed by the union of the vas deferens with the duct of the:","options":["Bulbourethral gland","Prostate gland","Seminal vesicle","Ureter"],"answer":2,"explanation":""},{"id":"C1-MCQ-09","type":"mcq","sourceNumber":9,"question":"The seminal vesicles are two pear-shaped lobulated pouches that measure approximately:","options":["2.5 cm long","5 cm long","7 cm long","10 cm long"],"answer":1,"explanation":""},{"id":"C1-MCQ-10","type":"mcq","sourceNumber":10,"question":"The seminal vesicles are situated on which aspect of the urinary bladder?","options":["Anterior aspect","Posterior aspect","Superior aspect","Inferior aspect"],"answer":1,"explanation":""},{"id":"C1-MCQ-11","type":"mcq","sourceNumber":11,"question":"Which structure secretes an alkaline fluid that contributes to the seminal fluid?","options":["Epididymis","Seminal vesicles","Bulbourethral glands","Prostate gland"],"answer":1,"explanation":""},{"id":"C1-MCQ-12","type":"mcq","sourceNumber":12,"question":"What is the largest accessory gland in the male reproductive system?","options":["Seminal vesicle","Bulbourethral gland","Prostate gland","Ampulla of vas deferens"],"answer":2,"explanation":""},{"id":"C1-MCQ-13","type":"mcq","sourceNumber":13,"question":"The prostate gland is positioned:","options":["Inferior to the external urethral sphincter and posterior to the rectum","Inferior to the bladder neck but superior to the internal urethral sphincter","Inferiorly to the neck of the bladder and superiorly to the external urethral sphincter","Superior to the bladder neck and inferior to the pelvic floor"],"answer":2,"explanation":""},{"id":"C1-MCQ-14","type":"mcq","sourceNumber":14,"question":"Proteolytic enzymes secreted by the prostate gland into the semen act to:","options":["Break down clotting factors in the ejaculate to keep semen in a fluid state","Keep sperm immobile until semen reaches the uterus","Dissolve the zona pellucida before sperm contact","Initiate clot formation so semen remains viscous in the urethra"],"answer":0,"explanation":""},{"id":"C1-MCQ-15","type":"mcq","sourceNumber":15,"question":"The primary sex organs in the female reproductive system are the:","options":["Fallopian tubes","Uterus","Ovaries","Cervix"],"answer":2,"explanation":""},{"id":"C1-MCQ-16","type":"mcq","sourceNumber":16,"question":"The average length of the uterine (Fallopian) tube is:","options":["5 cm","7 cm","10 cm","14 cm"],"answer":2,"explanation":""},{"id":"C1-MCQ-17","type":"mcq","sourceNumber":17,"question":"Which part of the Fallopian tube opens into the peritoneal cavity close to the ovary?","options":["Isthmus","Ampulla","Infundibulum","Intramural part"],"answer":2,"explanation":""},{"id":"C1-MCQ-18","type":"mcq","sourceNumber":18,"question":"Arrange the parts of the uterine tube from lateral to medial:","options":["Infundibulum -> Isthmus -> Ampulla -> Intramural part","Infundibulum -> Ampulla -> Isthmus -> Intramural part","Ampulla -> Infundibulum -> Isthmus -> Intramural part","Infundibulum -> Ampulla -> Intramural part -> Isthmus"],"answer":1,"explanation":""},{"id":"C1-MCQ-19","type":"mcq","sourceNumber":19,"question":"Fertilization normally occurs in which part of the uterine tube?","options":["Infundibulum","Isthmus","Ampulla","Intramural part"],"answer":2,"explanation":""},{"id":"C1-MCQ-20","type":"mcq","sourceNumber":20,"question":"The uterus lies anatomically between:","options":["Urinary bladder posteriorly and rectum anteriorly","The urinary bladder anteriorly and the rectum posteriorly","Urinary bladder anteriorly and vagina posteriorly","Rectum anteriorly and urinary bladder inferiorly"],"answer":1,"explanation":""},{"id":"C1-MCQ-21","type":"mcq","sourceNumber":21,"question":"The parts of the uterus are:","options":["Fundus, body, and cervix","Fundus, isthmus, and cervix","Body, isthmus, and cervix","Fundus, body, and isthmus"],"answer":0,"explanation":""},{"id":"C1-MCQ-22","type":"mcq","sourceNumber":22,"question":"The fundus of the uterus is defined as:","options":["The narrow portion projecting into the vagina","The main central part of the uterus","The part of the uterus lying above the entrance of the uterine tubes","The constricted neck of the uterus"],"answer":2,"explanation":""},{"id":"C1-MCQ-23","type":"mcq","sourceNumber":23,"question":"The cervix of the uterus is about:","options":["1 inch long","2.5 inches long","2 inches long","1.5 inches long"],"answer":0,"explanation":""},{"id":"C1-MCQ-24","type":"mcq","sourceNumber":24,"question":"The angle of anteversion of the uterus is the angulation between the:","options":["Long axis of the cervix and the long axis of the vagina (normally 90°)","Long axis of the cervix and vagina (normally 120°-170°)","Long axis of the body and vagina (normally 90°)","Long axis of the body and cervix (normally 90°)"],"answer":0,"explanation":""},{"id":"C1-MCQ-25","type":"mcq","sourceNumber":25,"question":"The angle of anteflexion of the uterus is normally:","options":["90°","120° - 170°","45°","180°"],"answer":1,"explanation":""},{"id":"C1-MCQ-26","type":"mcq","sourceNumber":26,"question":"The length of the anterior and posterior walls of the vagina are respectively:","options":["7 cm anteriorly and 8 cm posteriorly","8 cm anteriorly and 9 cm posteriorly","7 cm anteriorly and 9 cm posteriorly","9 cm anteriorly and 7 cm posteriorly"],"answer":2,"explanation":""},{"id":"C1-FILL-01","type":"fill","sourceNumber":1,"question":"Complete the statement (fill blanks in order): The primary sex organ in the male is the __________.","options":["testis","prostate gland","epididymis","seminal vesicle"],"answer":0,"explanation":"Correct completion: testis"},{"id":"C1-FILL-02","type":"fill","sourceNumber":2,"question":"Complete the statement (fill blanks in order): Commonly, the left testicle lies __________ than the right testicle.","options":["lower","more anterior","higher","more medial"],"answer":0,"explanation":"Correct completion: lower"},{"id":"C1-FILL-03","type":"fill","sourceNumber":3,"question":"Complete the statement (fill blanks in order): The testis consists of compartments (lobes), each lodging __________ seminiferous tubules.","options":["1-2","5-7","2-3","3-5"],"answer":2,"explanation":"Correct completion: 2-3"},{"id":"C1-FILL-04","type":"fill","sourceNumber":4,"question":"Complete the statement (fill blanks in order): The scrotum is a bag of skin descending from the anterior abdominal wall that contains the testes, epididymis, and lower ends of the __________.","options":["epididymal tails","inguinal canals","vas deferens","spermatic cord"],"answer":3,"explanation":"Correct completion: spermatic cord"},{"id":"C1-FILL-05","type":"fill","sourceNumber":5,"question":"Complete the statement (fill blanks in order): The epididymis is applied to the __________ border of the testis.","options":["posterior (posterolateral)","superior (dorsal)","medial (anteromedial)","anterior (anterolateral)"],"answer":0,"explanation":"Correct completion: posterior (posterolateral)"},{"id":"C1-FILL-06","type":"fill","sourceNumber":6,"question":"Complete the statement (fill blanks in order): The epididymis is formed of three parts: __________, __________, and __________.","options":["base, body, tail","head, neck, tail","head, body, tail","head, body, fundus"],"answer":2,"explanation":"Correct completion: head, body, tail"},{"id":"C1-FILL-07","type":"fill","sourceNumber":7,"question":"Complete the statement (fill blanks in order): Spermatozoa are stored and matured in the __________.","options":["epididymis","ejaculatory duct","vas deferens","seminiferous tubules"],"answer":0,"explanation":"Correct completion: epididymis"},{"id":"C1-FILL-08","type":"fill","sourceNumber":8,"question":"Complete the statement (fill blanks in order): The epididymis secretes a __________ secretion which carries the spermatozoa.","options":["protein-rich","mucoid","viscous","serous"],"answer":1,"explanation":"Correct completion: mucoid"},{"id":"C1-FILL-09","type":"fill","sourceNumber":9,"question":"Complete the statement (fill blanks in order): The vas deferens is the continuation of the __________ of the epididymis.","options":["tail","body","head","duct"],"answer":0,"explanation":"Correct completion: tail"},{"id":"C1-FILL-10","type":"fill","sourceNumber":10,"question":"Complete the statement (fill blanks in order): The ejaculatory duct is formed by the union of the duct of the vas deferens with the duct of the __________.","options":["epididymis","seminal vesicle","prostate gland","bulbourethral gland"],"answer":1,"explanation":"Correct completion: seminal vesicle"},{"id":"C1-FILL-11","type":"fill","sourceNumber":11,"question":"Complete the statement (fill blanks in order): Seminal vesicles are two pear-shaped lobulated pouches, each measuring approximately __________ cm long.","options":["10","7","3","5"],"answer":3,"explanation":"Correct completion: 5"},{"id":"C1-FILL-12","type":"fill","sourceNumber":12,"question":"Complete the statement (fill blanks in order): The seminal vesicles secrete an __________ secretion of the seminal fluid.","options":["alkaline","acidic","isotonic","amphoteric"],"answer":0,"explanation":"Correct completion: alkaline"},{"id":"C1-FILL-13","type":"fill","sourceNumber":13,"question":"Complete the statement (fill blanks in order): The largest accessory gland in the male reproductive system is the __________.","options":["prostate gland","bulbourethral gland","epididymis","seminal vesicle"],"answer":0,"explanation":"Correct completion: prostate gland"},{"id":"C1-FILL-14","type":"fill","sourceNumber":14,"question":"Complete the statement (fill blanks in order): The prostate is positioned inferiorly to the __________ and superiorly to the __________.","options":["neck of the bladder, external urethral sphincter","fundus of the bladder, pelvic diaphragm","neck of the bladder, internal urethral sphincter","base of the prostate, internal urethral sphincter"],"answer":0,"explanation":"Correct completion: neck of the bladder, external urethral sphincter"},{"id":"C1-FILL-15","type":"fill","sourceNumber":15,"question":"Complete the statement (fill blanks in order): The prostate secretes __________ enzymes into the semen to break down clotting factors.","options":["amylolytic","coagulating","lipolytic","proteolytic"],"answer":3,"explanation":"Correct completion: proteolytic"},{"id":"C1-FILL-16","type":"fill","sourceNumber":16,"question":"Complete the statement (fill blanks in order): The female primary sex organs are the __________.","options":["ovaries","corpora lutea","Graafian follicles","uterine tubes"],"answer":0,"explanation":"Correct completion: ovaries"},{"id":"C1-FILL-17","type":"fill","sourceNumber":17,"question":"Complete the statement (fill blanks in order): The process by which the ovum is released from the ovary is called __________.","options":["oocyte activation","luteinization","follicular maturation","ovulation"],"answer":3,"explanation":"Correct completion: ovulation"},{"id":"C1-FILL-18","type":"fill","sourceNumber":18,"question":"Complete the statement (fill blanks in order): The uterine tubes measure approximately __________ cm in length.","options":["15","12","10","7"],"answer":2,"explanation":"Correct completion: 10"},{"id":"C1-FILL-19","type":"fill","sourceNumber":19,"question":"Complete the statement (fill blanks in order): The four parts of the Fallopian tube from lateral to medial are: __________, __________, __________, and __________.","options":["infundibulum, ampulla, intramural part, isthmus","infundibulum, isthmus, ampulla, intramural part","infundibulum, ampulla, isthmus, intramural part","ampulla, infundibulum, isthmus, intramural part"],"answer":2,"explanation":"Correct completion: infundibulum, ampulla, isthmus, intramural part"},{"id":"C1-FILL-20","type":"fill","sourceNumber":20,"question":"Complete the statement (fill blanks in order): The uterus lies between the __________ anteriorly and the __________ posteriorly.","options":["urinary bladder, sigmoid colon","rectum, urinary bladder","pubic symphysis, urinary bladder","urinary bladder, rectum"],"answer":3,"explanation":"Correct completion: urinary bladder, rectum"},{"id":"C1-FILL-21","type":"fill","sourceNumber":21,"question":"Complete the statement (fill blanks in order): The three parts of the uterus are: __________, __________, and __________.","options":["fundus, body, isthmus","fundus, isthmus, cervix","body, isthmus, cervix","fundus, body, cervix"],"answer":3,"explanation":"Correct completion: fundus, body, cervix"},{"id":"C1-FILL-22","type":"fill","sourceNumber":22,"question":"Complete the statement (fill blanks in order): The part of the uterus lying above the entrance of the uterine tubes is the __________.","options":["body","isthmus","fundus","cervix"],"answer":2,"explanation":"Correct completion: fundus"},{"id":"C1-FILL-23","type":"fill","sourceNumber":23,"question":"Complete the statement (fill blanks in order): The cervix of the uterus is approximately __________ inch(es) long.","options":["1.5","2","2.5","1"],"answer":3,"explanation":"Correct completion: 1"},{"id":"C1-FILL-24","type":"fill","sourceNumber":24,"question":"Complete the statement (fill blanks in order): Anteversion is the angulation between the long axis of the __________ and the long axis of the __________ (90°).","options":["body of the uterus, cervix","cervix, vagina","body of the uterus, vagina","fundus, cervix"],"answer":1,"explanation":"Correct completion: cervix, vagina"},{"id":"C1-FILL-25","type":"fill","sourceNumber":25,"question":"Complete the statement (fill blanks in order): Anteflexion is the angulation between the long axis of the __________ and the long axis of the __________ (120°-170°).","options":["fundus, vagina","body of the uterus, vagina","cervix, vagina","cervix, body of the uterus"],"answer":3,"explanation":"Correct completion: cervix, body of the uterus"},{"id":"C1-FILL-26","type":"fill","sourceNumber":26,"question":"Complete the statement (fill blanks in order): The anterior wall of the vagina is __________ cm, while its posterior wall is __________ cm.","options":["7, 9","9, 7","8, 10","7, 8"],"answer":0,"explanation":"Correct completion: 7, 9"},{"id":"C1-ESSAY-01","type":"essay","sourceNumber":1,"question":"Describe the anatomy of the male genital system, tracing the pathway of sperm from formation to delivery. — Which option best summarizes the model answer?","options":["Testes produce sperm; sperm mature in the epididymis, pass via ureters and ejaculatory ducts, and exit through the urethra, with seminal vesicle and prostate secretions.","Testes produce sperm; sperm mature in the epididymis, pass via vas deferens and ejaculatory ducts, and exit through the urethra, with epididymal and bulbourethral secretions only.","Testes produce sperm; sperm mature inside the seminiferous tubules, pass via vas deferens and ejaculatory ducts, and exit through the urethra, with seminal vesicle and prostate secretions.","Testes produce sperm; sperm mature in the epididymis, pass via vas deferens and ejaculatory ducts, and exit through the urethra, with seminal vesicle and prostate secretions."],"answer":3,"explanation":"1. Testes: Primary male sex organs in the scrotum (left lies lower than right). Lobes contain 2-3 seminiferous tubules producing spermatozoa and Leydig cells producing testosterone. 2. Epididymis: Applied posterolaterally to the testis; consists of head, body, and tail. Stores and matures spermatozoa and provides mucoid secretion. 3. Vas Deferens: Continuation of the tail of the epididymis; traverses the spermatic cord and inguinal canal to reach the posterior bladder. 4. Seminal Vesicles: 5-cm lobulated pouches behind the bladder; secrete alkaline fluid. Each joins a vas deferens to form an ejaculatory duct. 5. Ejaculatory Ducts: Pierce the prostate gland to open into the prostatic urethra. 6. Prostate Gland: Largest accessory gland, located inferior to bladder neck and superior to external urethral sphincter. Secretes proteolytic enzymes breaking down clotting factors to keep semen fluid. 7. Urethra & External Genitalia: Dual pathway transmitting urine and ejaculate to the exterior."},{"id":"C1-ESSAY-02","type":"essay","sourceNumber":2,"question":"Describe the anatomy of the female genital system, detailing the uterine tubes and uterus. — Which option best summarizes the model answer?","options":["Ovaries produce ova; uterine tubes have infundibulum, ampulla, isthmus and intramural part; uterus has fundus, body and cervix; vagina connects uterus to vestibule.","Ovaries produce ova; uterine tubes have infundibulum, ampulla, isthmus and intramural part; uterus has fundus, body and cervix; vagina connects the ovary to the vestibule.","Ovaries produce ova; uterine tubes have infundibulum, ampulla, isthmus and intramural part; uterus has fundus, isthmus and cervix; vagina connects uterus to vestibule.","Ovaries produce ova; uterine tubes have infundibulum, isthmus, ampulla and intramural part; uterus has fundus, body and cervix; vagina connects uterus to vestibule."],"answer":0,"explanation":"1. Ovaries: Primary female sex organs on lateral pelvic walls; produce ova and hormones (estrogen and progesterone). 2. Uterine (Fallopian) Tubes (10 cm long): - Infundibulum: Lateral funnel opening into peritoneal cavity, fringed by fimbriae sweeping over the ovary. - Ampulla: Widest and longest portion (5 cm); normal site of fertilization. - Isthmus: Narrow, cord-like segment (2.5 cm) entering uterine cornu. - Intramural Part: Traverses the thick uterine wall (1.25 cm) into the cavity. 3. Uterus: Muscular pear-shaped organ between bladder and rectum; parts include Fundus (above tube entrance), Body (main triangular portion), and Cervix (1 inch long cylindrical lower part). 4. Vagina: Musculomembranous canal connecting uterus with vestibule (anterior wall 7 cm, posterior wall 9 cm). 5. External Genitalia: Clitoris, mons pubis, labia majora, labia minora, and vestibule."},{"id":"C1-ESSAY-03","type":"essay","sourceNumber":3,"question":"Explain the normal position and axes of the uterus (Anteversion and Anteflexion). — Which option best summarizes the model answer?","options":["Anteversion is the cervix-vagina angle (about 90°); anteflexion is the uterus-body-to-vagina angle (120°-170°).","Anteversion is the uterine-body-to-cervix angle (about 90°); anteflexion is the uterus-body-to-cervix angle (120°-170°).","Anteversion is the cervix-vagina angle (about 120°-170°); anteflexion is the uterus-body-to-cervix angle (120°-170°).","Anteversion is the cervix-vagina angle (about 90°); anteflexion is the uterus-body-to-cervix angle (120°-170°)."],"answer":3,"explanation":"• Anteversion: Angulation between the long axis of the cervix and the long axis of the vagina. It is normally 90°. • Anteflexion: Angulation between the long axis of the uterine body and the long axis of the cervix. It is normally an obtuse angle between 120° and 170°."},{"id":"C1-MATCH-01","type":"matching","sourceNumber":1,"question":"Match the following item to its description: Testis","options":["Accessory male organ that produces most seminal alkaline fluid","Primary male organ that stores sperm after their maturation","Primary male sex organ; lodges seminiferous tubules","Primary male organ that collects sperm from the ejaculatory duct"],"answer":2,"explanation":"Testis → Primary male sex organ; lodges seminiferous tubules"},{"id":"C1-MATCH-02","type":"matching","sourceNumber":2,"question":"Match the following item to its description: Epididymis","options":["Formed of head, body, tail; stores and matures sperm","Formed of head, body, tail; produces the main seminal alkaline fluid","Formed of head, body, tail; conveys sperm directly to urethra","Formed of head, body, tail; site of initial sperm formation"],"answer":0,"explanation":"Epididymis → Formed of head, body, tail; stores and matures sperm"},{"id":"C1-MATCH-03","type":"matching","sourceNumber":3,"question":"Match the following item to its description: Seminal vesicle","options":["5 cm long pouch; secretes alkaline seminal fluid","7 cm long pouch; provides the principal testosterone secretion","4 cm long pouch; secretes proteolytic seminal enzymes","5 cm long pouch; stores spermatozoa for maturation"],"answer":0,"explanation":"Seminal vesicle → 5 cm long pouch; secretes alkaline seminal fluid"},{"id":"C1-MATCH-04","type":"matching","sourceNumber":4,"question":"Match the following item to its description: Prostate gland","options":["Largest accessory male gland; forms the sperm head and acrosome","Largest accessory male gland; stores sperm for maturation","Largest accessory male gland; provides alkaline fluid from a pair of pouches","Largest accessory male gland; secretes proteolytic enzymes"],"answer":3,"explanation":"Prostate gland → Largest accessory male gland; secretes proteolytic enzymes"},{"id":"C1-MATCH-05","type":"matching","sourceNumber":5,"question":"Match the following item to its description: Ampulla of uterine tube","options":["Widest part of Fallopian tube; site of fertilization","Widest part of uterine tube; opens into the peritoneal cavity","Widest part of uterine tube; traverses the uterine wall","Narrowest part of uterine tube; usual site of fertilization"],"answer":0,"explanation":"Ampulla of uterine tube → Widest part of Fallopian tube; site of fertilization"},{"id":"C1-MATCH-06","type":"matching","sourceNumber":6,"question":"Match the following item to its description: Fundus of uterus","options":["Part of uterus projecting into the vagina below the uterine body","Part of uterus forming the central triangular cavity","Part of uterus connecting the cavity with the vagina","Part of uterus above the entrance of uterine tubes"],"answer":3,"explanation":"Fundus of uterus → Part of uterus above the entrance of uterine tubes"}]},{"id":3,"title":"Ovulation & Corpus Luteum","questions":[{"id":"C3-MCQ-01","type":"mcq","sourceNumber":1,"question":"The cyclic changes in the ovary under the effects of FSH and LH are known as the:","options":["Ovarian cycle","Follicular endometrial cycle","Endometrial cycle","Hypothalamic-pituitary cycle"],"answer":0,"explanation":""},{"id":"C3-MCQ-02","type":"mcq","sourceNumber":2,"question":"Which hormone stimulates the maturation of the Graafian follicle during the follicular phase?","options":["Prolactin","hCG (Human Chorionic Gonadotropin)","FSH (Follicle Stimulating Hormone)","LH (Luteinizing Hormone)"],"answer":2,"explanation":""},{"id":"C3-MCQ-03","type":"mcq","sourceNumber":3,"question":"Ovulation is triggered primarily by:","options":["A withdrawal of both FSH and LH","A primary FSH surge with no LH change","An LH surge (luteinizing hormone surge)","A sustained progesterone peak without LH change"],"answer":2,"explanation":""},{"id":"C3-MCQ-04","type":"mcq","sourceNumber":4,"question":"In a standard 28-day cycle, ovulation typically occurs on day:","options":["18","12","16","14"],"answer":3,"explanation":""},{"id":"C3-MCQ-05","type":"mcq","sourceNumber":5,"question":"The corpus luteum secretes primarily:","options":["Progesterone (and a small amount of LH)","Progesterone (and a small amount of estrogen)","LH (and a small amount of FSH)","Estrogen (with a small amount of progesterone)"],"answer":1,"explanation":""},{"id":"C3-MCQ-06","type":"mcq","sourceNumber":6,"question":"If fertilization does NOT occur, the corpus luteum degenerates after about 10-14 days into a fibrous white scar called:","options":["Corpus luteum of pregnancy","Corpus albicans","Graafian follicle","Atretic follicle"],"answer":1,"explanation":""},{"id":"C3-MCQ-07","type":"mcq","sourceNumber":7,"question":"If fertilization DOES occur, the corpus luteum of pregnancy remains active for approximately:","options":["6 months","8 months","2 months","4 months"],"answer":3,"explanation":""},{"id":"C3-MCQ-09","type":"mcq","sourceNumber":9,"question":"The proliferative phase of the uterine cycle is governed by which hormone?","options":["Progesterone","Estrogen","LH","Oxytocin"],"answer":1,"explanation":""},{"id":"C3-MCQ-10","type":"mcq","sourceNumber":10,"question":"The secretory phase of the uterine cycle is governed by which hormone?","options":["Estrogen","Progesterone","FSH","Prolactin"],"answer":1,"explanation":""},{"id":"C3-FILL-01","type":"fill","sourceNumber":1,"question":"Complete the statement (fill blanks in order): The process by which a mature ovum is released from the Graafian follicle is called __________.","options":["follicular recruitment","luteinization","ovulation","capacitation"],"answer":2,"explanation":"Correct completion: ovulation"},{"id":"C3-FILL-02","type":"fill","sourceNumber":2,"question":"Complete the statement (fill blanks in order): The ovarian cycle consists of three phases: __________ phase, __________ phase, and __________ phase.","options":["follicular, implantation, luteal","follicular, ovulation, menstrual","proliferative, ovulation, secretory","follicular, ovulation, luteal"],"answer":3,"explanation":"Correct completion: follicular, ovulation, luteal"},{"id":"C3-FILL-03","type":"fill","sourceNumber":3,"question":"Complete the statement (fill blanks in order): Graafian follicle maturation is stimulated by the pituitary hormone __________.","options":["FSH","hCG","prolactin","LH"],"answer":0,"explanation":"Correct completion: FSH"},{"id":"C3-FILL-04","type":"fill","sourceNumber":4,"question":"Complete the statement (fill blanks in order): The Graafian follicle secretes the hormone __________ during the follicular phase.","options":["inhibin","LH","progesterone","estrogen"],"answer":3,"explanation":"Correct completion: estrogen"},{"id":"C3-FILL-05","type":"fill","sourceNumber":5,"question":"Complete the statement (fill blanks in order): Ovulation is triggered by a surge of __________ hormone from the pituitary gland.","options":["hCG","prolactin","FSH","LH"],"answer":3,"explanation":"Correct completion: LH"},{"id":"C3-FILL-06","type":"fill","sourceNumber":6,"question":"Complete the statement (fill blanks in order): Ovulation occurs on day __________ of a standard 28-day menstrual cycle (14 days before next menses).","options":["18","16","12","14"],"answer":3,"explanation":"Correct completion: 14"},{"id":"C3-FILL-07","type":"fill","sourceNumber":7,"question":"Complete the statement (fill blanks in order): Following ovulation, the ruptured Graafian follicle transforms into the __________ under the influence of LH.","options":["corpus luteum","secondary follicle","corpus albicans","primordial follicle"],"answer":0,"explanation":"Correct completion: corpus luteum"},{"id":"C3-FILL-08","type":"fill","sourceNumber":8,"question":"Complete the statement (fill blanks in order): The corpus luteum secretes large amounts of __________ and small amounts of __________.","options":["estrogen, progesterone","progesterone, LH","FSH, estrogen","progesterone, estrogen"],"answer":3,"explanation":"Correct completion: progesterone, estrogen"},{"id":"C3-FILL-09","type":"fill","sourceNumber":9,"question":"Complete the statement (fill blanks in order): If fertilization does not occur, the corpus luteum degenerates into a white fibrous scar called __________.","options":["primordial follicle","secondary follicle","corpus albicans","corpus luteum of pregnancy"],"answer":2,"explanation":"Correct completion: corpus albicans"},{"id":"C3-FILL-10","type":"fill","sourceNumber":10,"question":"Complete the statement (fill blanks in order): If fertilization occurs, the corpus luteum persists for __________ months until the placenta takes over.","options":["4","2","9","6"],"answer":0,"explanation":"Correct completion: 4"},{"id":"C3-FILL-12","type":"fill","sourceNumber":12,"question":"Complete the statement (fill blanks in order): The proliferative phase of the uterine cycle lasts about 10 days and is controlled by __________.","options":["LH","FSH","progesterone","estrogen"],"answer":3,"explanation":"Correct completion: estrogen"},{"id":"C3-FILL-13","type":"fill","sourceNumber":13,"question":"Complete the statement (fill blanks in order): The secretory phase of the uterine cycle lasts about 14 days and is controlled by __________.","options":["progesterone","FSH","estrogen","LH"],"answer":0,"explanation":"Correct completion: progesterone"},{"id":"C3-FILL-14","type":"fill","sourceNumber":14,"question":"Complete the statement (fill blanks in order): Endometrial thickness reaches __________ mm during the secretory phase.","options":["9 - 12","5 - 8","12 - 15","2 - 4"],"answer":1,"explanation":"Correct completion: 5 - 8"},{"id":"C3-ESSAY-01","type":"essay","sourceNumber":1,"question":"Detail the phases and hormonal regulation of the Ovarian Cycle. — Which option best summarizes the model answer?","options":["Follicular phase (FSH and estrogen), ovulation around day 21 (FSH surge), and luteal phase (progesterone-producing corpus luteum).","Follicular phase (FSH and estrogen), ovulation around day 14 (LH surge), and luteal phase (estrogen-producing corpus albicans).","Follicular phase (FSH and estrogen), ovulation around day 14 (LH surge), and luteal phase (progesterone-producing corpus luteum).","Follicular phase (LH and progesterone), ovulation around day 14 (LH surge), and luteal phase (progesterone-producing corpus luteum)."],"answer":2,"explanation":"• Follicular Phase (Days 1–13): Pituitary FSH stimulates primordial follicles to develop into a mature Graafian follicle. Follicular cells secrete estrogen, which stimulates endometrial proliferation. • Ovulation (Day 14): Triggered by an acute LH surge along with increased intrafollicular pressure and theca interna edema. The mature Graafian follicle ruptures, releasing the secondary oocyte surrounded by the corona radiata. • Luteal Phase (Days 15–28): Under LH, lutein pigment is deposited in granulosa and theca cells of the ruptured follicle, forming the corpus luteum. It secretes progesterone and small amounts of estrogen. If fertilization occurs, it persists for 4 months; without fertilization, it degenerates in 10-14 days into the corpus albicans."},{"id":"C3-MATCH-01","type":"matching","sourceNumber":1,"question":"Match the following item to its description: Follicular phase","options":["Under progesterone control; follicle develops into mature ovum","Under FSH influence; Graafian follicle secretes estrogen","Under FSH influence; corpus luteum secretes progesterone","Under LH surge; follicle transforms directly to corpus albicans"],"answer":1,"explanation":"Follicular phase → Under FSH influence; Graafian follicle secretes estrogen"},{"id":"C3-MATCH-02","type":"matching","sourceNumber":2,"question":"Match the following item to its description: Ovulation","options":["Occurs about 7 days after menses; triggered by corpus luteum","14 days before next menses; triggered by acute LH surge","Occurs around day 14; stimulated primarily by sustained progesterone","Occurs near day 28; stimulated primarily by FSH decline"],"answer":1,"explanation":"Ovulation → 14 days before next menses; triggered by acute LH surge"},{"id":"C3-MATCH-03","type":"matching","sourceNumber":3,"question":"Match the following item to its description: Corpus luteum","options":["White fibrous remnant that secretes progesterone during pregnancy","Maturing ovarian follicle that secretes estrogen before ovulation","Yellow body; secretes progesterone to maintain endometrium","Yellow body that secretes LH to maintain the endometrium"],"answer":2,"explanation":"Corpus luteum → Yellow body; secretes progesterone to maintain endometrium"},{"id":"C3-MATCH-04","type":"matching","sourceNumber":4,"question":"Match the following item to its description: Proliferative phase","options":["Lasts 10 days; controlled by estrogen to repair endometrium","Lasts 10 days; controlled by progesterone to repair endometrium","Lasts 5 days; controlled by an LH surge during endometrial shedding","Lasts 14 days; controlled by estrogen to make endometrium secretory"],"answer":0,"explanation":"Proliferative phase → Lasts 10 days; controlled by estrogen to repair endometrium"},{"id":"C3-MATCH-05","type":"matching","sourceNumber":5,"question":"Match the following item to its description: Secretory phase","options":["Controlled by progesterone; endometrial thickness reaches 5-8 mm","Controlled by progesterone; endometrial thickness remains 1-2 mm","Controlled by estrogen; endometrial thickness reaches 5-8 mm","Controlled by FSH; endometrial thickness reaches 5-8 mm"],"answer":0,"explanation":"Secretory phase → Controlled by progesterone; endometrial thickness reaches 5-8 mm"},{"id":"C3-MATCH-06","type":"matching","sourceNumber":6,"question":"Match the following item to its description: Menstruation","options":["Shedding of the endometrium during a rise in progesterone","Shedding of endometrium due to drop in progesterone","Repair of the endometrium under estrogen after shedding","Secretory transformation under progesterone after ovulation"],"answer":1,"explanation":"Menstruation → Shedding of endometrium due to drop in progesterone"}]},{"id":2,"title":"Spermatogenesis & Oogenesis","questions":[{"id":"C2-MCQ-01","type":"mcq","sourceNumber":1,"question":"Somatic cells divide by:","options":["Meiosis I followed by meiosis II","Mitosis","Spermatogonial reduction division","Binary fission without chromosome duplication"],"answer":1,"explanation":""},{"id":"C2-MCQ-02","type":"mcq","sourceNumber":2,"question":"In mitosis, one diploid parent cell (2n) produces:","options":["Two genetically identical haploid daughter cells (1n)","Two genetically distinct diploid daughter cells (2n)","Four genetically distinct haploid daughter cells (1n)","Two genetically identical diploid daughter cells (2n)"],"answer":3,"explanation":""},{"id":"C2-MCQ-03","type":"mcq","sourceNumber":3,"question":"In meiosis, a diploid germ cell undergoes two successive divisions resulting in:","options":["Two genetically distinct haploid daughter cells (1n)","Four daughter cells with the haploid number of chromosomes (1n)","Four genetically identical haploid daughter cells (1n)","Two genetically identical diploid daughter cells (2n)"],"answer":1,"explanation":""},{"id":"C2-MCQ-04","type":"mcq","sourceNumber":4,"question":"Spermatogenesis begins at:","options":["Fetal life during germ-cell migration","Early childhood before the onset of gonadotropin activity","At birth after spermatogonia become spermatocytes","Puberty"],"answer":3,"explanation":""},{"id":"C2-MCQ-05","type":"mcq","sourceNumber":5,"question":"The primary spermatocyte enters which division to produce secondary spermatocytes?","options":["Second meiotic division","First meiotic division","Spermiogenesis after meiosis II","Mitotic division before meiosis I"],"answer":1,"explanation":""},{"id":"C2-MCQ-06","type":"mcq","sourceNumber":6,"question":"The transformation of a rounded spermatid into a mature flagellated spermatozoon is called:","options":["Spermiation","Spermatocytogenesis","Meiotic maturation","Spermiogenesis"],"answer":3,"explanation":""},{"id":"C2-MCQ-07","type":"mcq","sourceNumber":7,"question":"During spermiogenesis, the Golgi apparatus condenses to form the:","options":["Mitochondrial sheath","Sperm centriole","Acrosome cap","Axonemal flagellum"],"answer":2,"explanation":""},{"id":"C2-MCQ-08","type":"mcq","sourceNumber":8,"question":"The mitochondria in the mature spermatozoon are spirally arranged in the:","options":["Neck of the sperm","Middle piece","Principal piece of the flagellum","Acrosomal region of the head"],"answer":1,"explanation":""},{"id":"C2-MCQ-09","type":"mcq","sourceNumber":9,"question":"The entire process of spermatogenesis from spermatogonia to mature sperm requires approximately:","options":["84 days","54 days","74 days","64 days"],"answer":3,"explanation":""},{"id":"C2-MCQ-10","type":"mcq","sourceNumber":10,"question":"Near the time of birth, all primary oocytes in the female ovary are arrested in:","options":["Prophase of meiosis II (diplotene stage)","Prophase of meiosis I (diplotene / resting stage)","Metaphase of meiosis II (secondary oocyte arrest)","Metaphase of meiosis I (resting stage)"],"answer":1,"explanation":""},{"id":"C2-MCQ-11","type":"mcq","sourceNumber":11,"question":"The primary oocyte completes its first meiotic division:","options":["At the moment of sperm-oocyte membrane fusion","Just after the LH surge but after ovulation","Shortly before ovulation","During initial embryonic implantation"],"answer":2,"explanation":""},{"id":"C2-MCQ-12","type":"mcq","sourceNumber":12,"question":"Completion of the first meiotic division in the female yields a secondary oocyte and the:","options":["First polar body","Second polar body","A pair of secondary oocytes","An additional primary oocyte"],"answer":0,"explanation":""},{"id":"C2-MCQ-13","type":"mcq","sourceNumber":13,"question":"The secondary oocyte is arrested in which stage until fertilization occurs?","options":["Anaphase I","Metaphase I","Prophase II","Metaphase II"],"answer":3,"explanation":""},{"id":"C2-MCQ-14","type":"mcq","sourceNumber":14,"question":"In females, oogenesis begins during:","options":["Prenatal (fetal) life","Immediately after onset of puberty","Just after completion of meiosis II","Early neonatal life"],"answer":0,"explanation":""},{"id":"C2-MCQ-15","type":"mcq","sourceNumber":15,"question":"The glycoprotein layer surrounding the oocyte that must be penetrated by sperm is the:","options":["Oolemma","Corona radiata","Theca interna","Zona pellucida"],"answer":3,"explanation":""},{"id":"C2-FILL-01","type":"fill","sourceNumber":1,"question":"Complete the statement (fill blanks in order): Cell division in somatic cells occurs by __________, producing two identical diploid cells (2n).","options":["meiosis II","mitosis","amitotic division","meiosis I"],"answer":1,"explanation":"Correct completion: mitosis"},{"id":"C2-FILL-02","type":"fill","sourceNumber":2,"question":"Complete the statement (fill blanks in order): Cell division in germ cells to form gametes occurs by __________, producing haploid cells (1n).","options":["spermiogenesis","meiosis","cleavage","mitosis"],"answer":1,"explanation":"Correct completion: meiosis"},{"id":"C2-FILL-03","type":"fill","sourceNumber":3,"question":"Complete the statement (fill blanks in order): Gametes contain the __________ number of chromosomes (23 chromosomes).","options":["haploid (1n)","aneuploid (2n±1)","diploid (2n)","tetraploid (4n)"],"answer":0,"explanation":"Correct completion: haploid (1n)"},{"id":"C2-FILL-04","type":"fill","sourceNumber":4,"question":"Complete the statement (fill blanks in order): Spermatogenesis takes place in the __________ tubules of the testis.","options":["seminiferous","rete testis","straight","efferent"],"answer":0,"explanation":"Correct completion: seminiferous"},{"id":"C2-FILL-05","type":"fill","sourceNumber":5,"question":"Complete the statement (fill blanks in order): Spermatogenesis begins at the age of __________ and continues until __________.","options":["adolescence, early adulthood","fetal life, puberty","birth, adolescence","puberty, old age"],"answer":3,"explanation":"Correct completion: puberty, old age"},{"id":"C2-FILL-06","type":"fill","sourceNumber":6,"question":"Complete the statement (fill blanks in order): The mother stem cells of sperm lying on the basement membrane are called __________.","options":["spermatids","primary spermatocytes","Sertoli cells","spermatogonia"],"answer":3,"explanation":"Correct completion: spermatogonia"},{"id":"C2-FILL-07","type":"fill","sourceNumber":7,"question":"Complete the statement (fill blanks in order): Spermatogonia differentiate into __________ spermatocytes, which then enter the first meiotic division.","options":["primary","secondary","mature","haploid"],"answer":0,"explanation":"Correct completion: primary"},{"id":"C2-FILL-08","type":"fill","sourceNumber":8,"question":"Complete the statement (fill blanks in order): The first meiotic division converts a primary spermatocyte into two __________ spermatocytes.","options":["secondary","tertiary","rounded","primary"],"answer":0,"explanation":"Correct completion: secondary"},{"id":"C2-FILL-09","type":"fill","sourceNumber":9,"question":"Complete the statement (fill blanks in order): The second meiotic division converts secondary spermatocytes into __________.","options":["spermatozoa","secondary spermatocytes","spermatids","primary spermatocytes"],"answer":2,"explanation":"Correct completion: spermatids"},{"id":"C2-FILL-10","type":"fill","sourceNumber":10,"question":"Complete the statement (fill blanks in order): The morphological transformation of non-motile rounded spermatids into mature flagellated spermatozoa is called __________.","options":["spermiogenesis","spermatocytogenesis","spermiation","meiosis II"],"answer":0,"explanation":"Correct completion: spermiogenesis"},{"id":"C2-FILL-11","type":"fill","sourceNumber":11,"question":"Complete the statement (fill blanks in order): The acrosomal cap of the sperm is derived from the cell's __________ apparatus.","options":["mitochondrial","Golgi","centrosomal","endoplasmic reticulum"],"answer":1,"explanation":"Correct completion: Golgi"},{"id":"C2-FILL-12","type":"fill","sourceNumber":12,"question":"Complete the statement (fill blanks in order): The flagellum (tail) of the sperm develops from the __________ / microtubules.","options":["acrosome","mitochondrial sheath","Golgi complex","centriole"],"answer":3,"explanation":"Correct completion: centriole"},{"id":"C2-FILL-13","type":"fill","sourceNumber":13,"question":"Complete the statement (fill blanks in order): The energy (ATP) required for sperm motility is produced by mitochondria located in the __________ of the sperm.","options":["middle piece","end piece","head","neck"],"answer":0,"explanation":"Correct completion: middle piece"},{"id":"C2-FILL-14","type":"fill","sourceNumber":14,"question":"Complete the statement (fill blanks in order): Oogenesis begins in females during __________ life.","options":["prenatal (fetal)","postnatal","pubertal","neonatal"],"answer":0,"explanation":"Correct completion: prenatal (fetal)"},{"id":"C2-FILL-15","type":"fill","sourceNumber":15,"question":"Complete the statement (fill blanks in order): At birth, all primary oocytes are arrested in the __________ stage of the prophase of meiosis I.","options":["pachytene (crossing-over stage)","diplotene (resting stage)","leptotene (early prophase)","diakinesis (terminal stage)"],"answer":1,"explanation":"Correct completion: diplotene (resting stage)"},{"id":"C2-FILL-16","type":"fill","sourceNumber":16,"question":"Complete the statement (fill blanks in order): The first meiotic division of the oocyte is completed shortly before __________.","options":["implantation","menstruation","fertilization","ovulation"],"answer":3,"explanation":"Correct completion: ovulation"},{"id":"C2-FILL-17","type":"fill","sourceNumber":17,"question":"Complete the statement (fill blanks in order): Completion of meiosis I in the female yields a secondary oocyte and the first __________.","options":["oocyte pronucleus","polar spindle","second polar body","polar body"],"answer":3,"explanation":"Correct completion: polar body"},{"id":"C2-FILL-18","type":"fill","sourceNumber":18,"question":"Complete the statement (fill blanks in order): The secondary oocyte is arrested in __________ of meiosis II until fertilization occurs.","options":["telophase","prophase","metaphase","anaphase"],"answer":2,"explanation":"Correct completion: metaphase"},{"id":"C2-ESSAY-01","type":"essay","sourceNumber":1,"question":"Compare Mitosis and Meiosis in terms of definition, site, division cycles, and chromosome numbers. — Which option best summarizes the model answer?","options":["Mitosis: one division in somatic cells gives two identical haploid cells; meiosis: two divisions in germ cells give four genetically varied haploid cells.","Mitosis: one division in somatic cells gives two identical diploid cells; meiosis: two divisions in germ cells give four genetically varied haploid cells.","Mitosis: two divisions in somatic cells give four identical diploid cells; meiosis: two divisions in germ cells give four genetically varied haploid cells.","Mitosis: one division in somatic cells gives two identical diploid cells; meiosis: one division in germ cells gives two genetically varied haploid cells."],"answer":1,"explanation":"• Site: Mitosis occurs in somatic cells throughout the body; Meiosis occurs exclusively in germ cells in the gonads (testes and ovaries). • Number of Divisions: Mitosis has 1 division cycle (Prophase, Metaphase, Anaphase, Telophase); Meiosis has 2 successive divisions (Meiosis I reductional, Meiosis II equational). • Daughter Cells: Mitosis produces 2 identical diploid (2n = 46) cells; Meiosis produces 4 genetically unique haploid (1n = 23) cells. • Genetic Variation: Mitosis has no crossing-over (genetic identity); Meiosis involves crossing-over in Prophase I, generating genetic diversity."},{"id":"C2-ESSAY-02","type":"essay","sourceNumber":2,"question":"Outline the stages of Spermatogenesis and describe the morphological changes of Spermiogenesis. — Which option best summarizes the model answer?","options":["Spermatogonia form secondary, then primary spermatocytes and spermatids; spermiogenesis forms the acrosome, elongated head, flagellum and mitochondrial middle piece.","Spermatogonia form primary, then secondary spermatocytes and spermatids; meiosis I forms the acrosome, elongated head, flagellum and mitochondrial middle piece.","Spermatogonia form primary, then secondary spermatocytes and spermatids; spermiogenesis forms the acrosome, elongated head, flagellum and mitochondrial middle piece.","Spermatogonia form primary, then secondary spermatocytes and spermatids; spermiogenesis forms the acrosome, elongated head, flagellum and mitochondrial sperm head."],"answer":2,"explanation":"• Stages of Spermatogenesis: 1. Spermatogonia (46, XY): Stem cells at the basement membrane of seminiferous tubules; divide mitotically. 2. Primary Spermatocytes (46, XY): Formed by differentiation; enter Meiosis I. 3. Secondary Spermatocytes (23, X or 23, Y): Result from Meiosis I; rapidly enter Meiosis II. 4. Spermatids (23, X or 23, Y): Four haploid rounded cells formed after Meiosis II. • Spermiogenesis (Transformation into Spermatozoa): - Formation of acrosome cap from the Golgi apparatus covering the anterior 2/3 of nucleus. - Condensation and elongation of the nucleus forming the sperm head. - Centrioles form the axial filament / flagellum (tail). - Mitochondria arrange spirally around the axial filament in the middle piece for energy. - Shedding of excess cytoplasm (phagocytosed by Sertoli cells). Takes approx. 64 days."},{"id":"C2-ESSAY-03","type":"essay","sourceNumber":3,"question":"Describe the stages of Oogenesis, highlighting timeline and the two arrest periods. — Which option best summarizes the model answer?","options":["Oogenesis begins before birth; primary oocytes arrest in Prophase I, and secondary oocytes arrest in Prophase I until fertilization.","Oogenesis begins before birth; primary oocytes arrest in Metaphase II, and secondary oocytes arrest in Metaphase II until fertilization.","Oogenesis begins before birth; primary oocytes arrest in Prophase I, and secondary oocytes arrest in Metaphase II until fertilization.","Oogenesis begins at puberty; primary oocytes arrest in Prophase I, and secondary oocytes arrest in Metaphase II until fertilization."],"answer":2,"explanation":"• Prenatal Life: Primordial germ cells differentiate into oogonia (46, XX), which divide by mitosis. By birth, all oogonia enlarge to become primary oocytes (46, XX) and enter Meiosis I, but arrest at Prophase I (diplotene stage). • Puberty to Menopause: Primary oocytes remain dormant until puberty. Each month, under FSH/LH, a cohort resumes development. Shortly before ovulation, the primary oocyte completes Meiosis I, yielding a secondary oocyte (23, X) and the 1st polar body. • Second Arrest & Fertilization: The secondary oocyte enters Meiosis II and arrests at Metaphase II. It is ovulated in this state. Meiosis II is completed only if fertilization occurs, yielding a mature ovum and 2nd polar body. Without fertilization, it degenerates in 24-36 hours."},{"id":"C2-MATCH-01","type":"matching","sourceNumber":1,"question":"Match the following item to its description: Spermatogonium","options":["Diploid cell entering first meiosis (46,XY)","Haploid sperm cell released after maturation (23,Y)","Diploid stem cell on seminiferous tubule basement membrane (46,XY)","Haploid germ cell formed after meiosis II (23,X)"],"answer":2,"explanation":"Spermatogonium → Diploid stem cell on seminiferous tubule basement membrane (46,XY)"},{"id":"C2-MATCH-02","type":"matching","sourceNumber":2,"question":"Match the following item to its description: Primary spermatocyte","options":["Haploid cell produced after the first meiotic division (23,X)","Diploid stem cell dividing on the basement membrane (46,XY)","Haploid germ cell formed after meiosis II (23,Y)","Diploid cell entering first meiotic division (46,XY)"],"answer":3,"explanation":"Primary spermatocyte → Diploid cell entering first meiotic division (46,XY)"},{"id":"C2-MATCH-03","type":"matching","sourceNumber":3,"question":"Match the following item to its description: Spermatid","options":["Four haploid motile sperm cells at the end of meiosis II (23 chromosomes)","Four diploid rounded cells resulting from meiosis II (46 chromosomes)","Two haploid secondary spermatocytes formed after meiosis I (23 chromosomes)","Four haploid rounded cells resulting from meiosis II (23 chromosomes)"],"answer":3,"explanation":"Spermatid → Four haploid rounded cells resulting from meiosis II (23 chromosomes)"},{"id":"C2-MATCH-04","type":"matching","sourceNumber":4,"question":"Match the following item to its description: Primary oocyte","options":["Diploid oogonium arrested in Metaphase II from birth (46,XX)","Diploid cell arrested in Prophase I from birth to puberty (46,XX)","Haploid cell arrested in Metaphase II before fertilization (23,X)","Diploid cell completing meiosis I only at fertilization (46,XX)"],"answer":1,"explanation":"Primary oocyte → Diploid cell arrested in Prophase I from birth to puberty (46,XX)"},{"id":"C2-MATCH-05","type":"matching","sourceNumber":5,"question":"Match the following item to its description: Secondary oocyte","options":["Diploid cell arrested in Prophase I before ovulation","Haploid cell arrested in Metaphase II at ovulation","Haploid cell arrested in Prophase II after ovulation","Haploid cell completing meiosis I at fertilization"],"answer":1,"explanation":"Secondary oocyte → Haploid cell arrested in Metaphase II at ovulation"}]}];
const TOTAL=12;
const ALL=BANK.flatMap(ch=>ch.questions);
const INDEX=new Map(ALL.map(q=>[q.id,q]));
const CHAPTER=new Map(BANK.map(ch=>[ch.id,ch]));
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
let current=null,completed=null;
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function chapterFor(q){return CHAPTER.get(Number(q.id.match(/^C(\d+)-/)[1]));}
function home(){current=null;completed=null;
let html=`<div class="card welcome">✍️ اختار المحاضرة وابدأ الحل</div><div class="chapters">
<button type="button" class="chapter comprehensive" data-scope="all"><strong>Comprehensive Exam — الامتحان الشامل</strong><small>12 random questions — 4 from each lecture • ${ALL.length} relevant questions</small></button>`;
for(const ch of BANK)html+=`<button type="button" class="chapter" data-scope="${ch.id}"><strong>${esc(ch.title)}</strong><small>${ch.questions.length} relevant questions • 12 random questions each time</small></button>`;
html+=`</div><p class="note">المحاضرات المقررة فقط. 12 سؤالًا عشوائيًا في كل محاولة، وإجابات فورية بالأحمر والأخضر. الشامل يحتوي 4 أسئلة من كل محاضرة.</p>`;
app.innerHTML=html;
app.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>start(b.dataset.scope));
}
function start(scope){const pool=scope==='all'?ALL:CHAPTER.get(Number(scope)).questions;
const chosen=scope==='all'?shuffle(BANK.flatMap(ch=>shuffle(ch.questions).slice(0,4))):shuffle(pool).slice(0,Math.min(TOTAL,pool.length));
current={scope,items:chosen.map(q=>({id:q.id,optionOrder:shuffle([0,1,2,3])})),answers:{},index:0};
completed=null;showQuestion();}
function showQuestion(){if(!current)return home();
const idx=current.index,item=current.items[idx],q=INDEX.get(item.id),selected=current.answers[q.id],ch=chapterFor(q);
const answered=selected!==undefined,correctPos=item.optionOrder.indexOf(q.answer),isCorrect=answered&&selected===correctPos;
let html=`<section class="card quiz-card"><div class="topline"><span class="counter">السؤال ${idx+1} من ${current.items.length}</span><span class="kind">${current.scope==='all'?'الامتحان الشامل':'اختبار المحاضرة '+ch.id}</span></div>
<div class="progress"><div style="width:${((idx+1)/current.items.length*100).toFixed(2)}%"></div></div>
<div class="chapter-label">${esc(ch.title)}</div>
<div class="q">${esc(q.question)}</div>
<div role="group" aria-label="اختر إجابة واحدة">${item.optionOrder.map((orig,pos)=>{
const cls=answered?(pos===correctPos?'correct':pos===selected?'wrong':''):'';
return `<button class="answer ${cls}" type="button" data-answer="${pos}" ${answered?'disabled':''} aria-pressed="${answered&&pos===selected?'true':'false'}"><span class="letter">${'ABCD'[pos]}.</span><span>${esc(q.options[orig])}</span></button>`
}).join('')}</div>
${answered?`<div class="feedback ${isCorrect?'':'bad'}" role="status" aria-live="polite"><h3>${isCorrect?'✓ إجابة صحيحة!':'✗ إجابتك غلط'}</h3><div class="correct-text">${isCorrect?'Correct!':'Correct answer:'} ${'ABCD'[correctPos]}. ${esc(q.options[q.answer])}</div>${q.explanation?`<details style="margin-top:7px"><summary>الشرح من البنك</summary><div class="exp">${esc(q.explanation)}</div></details>`:''}</div>`:''}
<div class="actions"><button type="button" class="btn alt" id="prev">${idx===0?'الرئيسية':'السابق'}</button><button type="button" class="btn" id="next" ${!answered?'disabled':''}>${idx===current.items.length-1?'إنهاء وعرض النتيجة':'التالي'}</button></div></section>`;
app.innerHTML=html;
if(!answered)app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(current.answers[q.id]!==undefined)return;current.answers[q.id]=Number(b.dataset.answer);showQuestion();});
app.querySelector('#prev').onclick=()=>{if(idx===0){if(confirm('العودة للرئيسية وإلغاء المحاولة الحالية؟'))home();}else{current.index--;showQuestion();}};
app.querySelector('#next').onclick=()=>{if(current.answers[q.id]===undefined)return;if(idx===current.items.length-1){finish();}else{current.index++;showQuestion();}};
window.scrollTo(0,0);
}
function finish(){if(!current)return;
const a=current.items.map(item=>({item,q:INDEX.get(item.id),chosen:current.answers[item.id]}));
if(a.some(x=>x.chosen===undefined))return;
const wrong=a.filter(x=>x.item.optionOrder[x.chosen]!==x.q.answer);
const right=a.length-wrong.length;
const percent=Math.round(right/a.length*100);
completed={scope:current.scope,wrong,right,total:a.length,percent};current=null;showResults();
}
function showResults(){const r=completed;if(!r)return home();
let message='';
if(r.wrong.length===0)message='🎉 ممتاز جدًا! كل إجاباتك صحيحة. استمر بنفس المستوى!';
else if(r.percent>=85)message='👏 ممتاز! عندك أخطاء بسيطة؛ راجع الأسئلة التي أخطأت فيها.';
else if(r.percent>=65)message='👍 جيد! لكن محتاج تراجع النقاط اللي غلطت فيها قبل ما تبدأ مجموعة جديدة.';
else message='📚 محتاج تذاكر أكتر وتراجع الأخطاء الموجودة تحت، وبعدها جرّب 12 سؤالًا جديدة.';
const countByChapter={};for(const x of r.wrong){const ch=chapterFor(x.q);countByChapter[ch.id]=(countByChapter[ch.id]||0)+1;}
const advice=Object.entries(countByChapter).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([num,count])=>`${esc(CHAPTER.get(Number(num)).title)} (${count} ${count===1?'خطأ':'أخطاء'})`);
let html=`<section class="card result"><h2>نتيجة الامتحان</h2><div class="score">${r.right} / ${r.total}</div><div class="percent">${r.percent}%</div><p class="message">${esc(message)}</p>
<div class="stats"><div><strong class="good">${r.right}</strong>إجابة صحيحة</div><div><strong class="bad">${r.wrong.length}</strong>إجابة غلط</div></div>
${advice.length?`<div class="guidance">📖 <strong>راجع بالذات:</strong> ${advice.join('، ')}.</div>`:'<div class="guidance">✅ لا توجد إجابات خاطئة في هذه المحاولة.</div>'}
<div class="buttons"><button type="button" class="btn" id="again">ابدأ 12 سؤالًا عشوائيًا جديدة</button><button type="button" class="btn alt" id="gohome">العودة لاختيار المحاضرة</button></div></section>`;
if(r.wrong.length){html+=`<section class="card review"><h3>الأسئلة الغلط والإجابات الصحيحة (${r.wrong.length})</h3>`;
for(const x of r.wrong){const ch=chapterFor(x.q);const answer=x.q.options[x.item.optionOrder[x.chosen]];
html+=`<div class="mistake"><div class="ref">${esc(ch.title)} • ${esc(x.q.id)}</div><strong>${esc(x.q.question)}</strong><div class="wrong">✘ Your answer: ${esc(answer)}</div><div class="correct">✔ Correct answer: ${esc(x.q.options[x.q.answer])}</div>${x.q.explanation?`<details><summary>شرح / إجابة البنك النموذجية</summary><div>${esc(x.q.explanation)}</div></details>`:''}</div>`;
}html+='</section>';}
app.innerHTML=html;
app.querySelector('#again').onclick=()=>start(r.scope);
app.querySelector('#gohome').onclick=()=>home();
window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
