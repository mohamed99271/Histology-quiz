<title>امتحان الهستولوجي - بنك الأسئلة</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b1b1f;--muted:#6b7280;--line:#e3e6eb;--accent:#b00020;--navy:#14213d;--ok:#1b7a3a;--okbg:#e4f5e8;--bad:#b00020;--badbg:#fde8eb;--sel:#e8effa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--ink:#eceef3;--muted:#9aa3b2;--line:#2c3342;--accent:#ff5c77;--navy:#0b1020;--ok:#5fd17f;--okbg:#17301f;--bad:#ff7d92;--badbg:#38181f;--sel:#22304a}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--ink:#eceef3;--muted:#9aa3b2;--line:#2c3342;--accent:#ff5c77;--navy:#0b1020;--ok:#5fd17f;--okbg:#17301f;--bad:#ff7d92;--badbg:#38181f;--sel:#22304a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:28px 20px;text-align:center;border-bottom:5px solid var(--accent)}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:#c9d1e0;font-size:15px}
.grid{display:grid;gap:12px;margin-top:20px}
.lec{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;color:inherit;font:inherit}
.lec:hover,.lec:focus-visible{border-color:var(--accent);outline:none}
.num{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.lec b{display:block;direction:ltr;text-align:left;font-size:16px}.lec small{color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;font:inherit}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.cnt{color:var(--muted);font-size:14px;direction:ltr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.ltitle{direction:ltr;text-align:left;color:var(--accent);font-weight:700;font-size:13px;margin-bottom:8px}
.q{direction:ltr;text-align:left;font-size:18px;font-weight:600;margin:0 0 14px}
.opts{display:grid;gap:10px;direction:ltr}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;color:inherit;font:inherit;font-size:16px}
.opt:hover:not(:disabled){background:var(--sel)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.btn{display:block;width:100%;margin-top:16px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.score{text-align:center}.score .big{font-size:56px;font-weight:800;color:var(--accent);direction:ltr}
.rev{margin-top:16px;display:grid;gap:10px}
.r{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--bad);border-radius:10px;padding:10px 12px;direction:ltr;text-align:left;font-size:15px}
.r em{color:var(--ok);font-style:normal;font-weight:600}
</style>

["The Barr body (sex chromatin) observed at the nuclear periphery of female somatic cells corresponds to:","One genetically inactive, condensed X chromosome","The active Y chromosome","The ribosomal DNA locus","The centromere of chromosome 1"],
["Normal human somatic cells contain:","44 autosomes and 2 sex chromosomes (total 46 chromosomes)","23 chromosomes","22 pairs of sex chromosomes","46 pairs of autosomes"],
["Chromosome morphology, size, and banding patterns are examined with maximal clarity during:","Metaphase of cell division","Prophase","Anaphase","Interphase"],
["During metaphase, each chromosome consists of two identical sister chromatids held together at the:","Centromere (primary constriction)","Nuclear pore complex","Barr body","Nucleolus"],
["Karyotyping of fetal cells obtained via amniocentesis is clinically applied to:","Detect major numerical (e.g., Down syndrome) and structural chromosomal anomalies","Measure total mitochondrial ATP production","Enumerate the exact number of lysosomes","Assess lipid droplet storage"],
["Under LM, the nucleus stains "+B+" with routine H&E stain due to the high density of nucleic acids.","basophilic (blue/purple)","acidophilic (pink)","metachromatic","argyrophilic (black)"],
["The four primary structural components of the eukaryotic nucleus are "+B+", "+B+", "+B+", and "+B+".","nuclear envelope / chromatin / nucleolus / nucleoplasm","nuclear envelope / euchromatin / heterochromatin / nucleolus","nuclear pores / chromatin / nucleolus / nucleoplasm","nuclear envelope / chromosomes / Barr body / nucleolus"],
["The nuclear lamina is composed of intermediate filaments made of "+B+" proteins and lines the "+B+" aspect of the inner nuclear membrane.","lamin / inner","lamin / outer","keratin / inner","tubulin / outer"],
[B+" cells contain 46 chromosomes (diploid, 2n), while "+B+" cells (sperms and ova) contain 23 chromosomes (haploid, n).","Somatic / germ (gamete)","Germ (gamete) / somatic","Somatic / embryonic stem","Epithelial / muscle"],
["Metaphase chromosomes are paired and arranged in a photographic chart according to size, shape, and centromeric position to construct a/an "+B+".","karyotype","chromatid map","genome","chromatin profile"],
["Give scientific reasons: Why does an active protein-synthesizing cell (like a hepatocyte) have a pale (vesicular) nucleus, while a resting lymphocyte has a dark (dense) nucleus?","In actively transcribing cells chromatin is mostly uncoiled euchromatin (lightly basophilic); inactive resting cells pack DNA into dense heterochromatin clumps (darkly basophilic).","Hepatocytes contain less DNA than lymphocytes, so their nuclei take less hematoxylin.","Hepatocytes have a thicker nuclear envelope that blocks the stain, while lymphocytes have none.","Lymphocytes contain several large nucleoli that fill the nucleus, while hepatocytes have none."],
["Give scientific reasons: Why is metaphase chosen as the optimal phase for chromosomal karyotyping?","At metaphase, chromosomes reach their peak condensation and the sister chromatids become sharply distinct and easily identified under the light microscope.","At metaphase, the nuclear envelope is intact and holds all chromosomes in one place.","At metaphase, DNA replication is complete and chromosomes are uncoiled as euchromatin for easy staining.","At metaphase, the chromatids have already separated, so each chromosome can be counted individually."],
["Compare between Euchromatin and Heterochromatin.","Euchromatin: transcriptionally active, fine fibrils under EM, pale (vesicular) under LM, predominates in active cells such as neurons and hepatocytes. Heterochromatin: transcriptionally silent, dense coarse clumps under EM, dark under LM, predominates in resting lymphocytes.","Euchromatin: transcriptionally silent, dense coarse clumps, dark under LM, predominates in resting lymphocytes. Heterochromatin: active, fine fibrils, pale under LM, predominates in hepatocytes.","Euchromatin: active, dense clumps under EM, dark under LM, found only in the Barr body. Heterochromatin: inactive, fine fibrils, pale under LM.","Euchromatin: inactive and located only at the nuclear periphery. Heterochromatin: active, diffuse and filling the nucleus of neurons."],
["Define Karyotype and explain its clinical utility.","Karyotype: standardized arrangement of metaphase chromosomes in homologous pairs by size and centromeric position. Utility: prenatal diagnosis of aneuploidies (Down 47,+21; Turner 45,X0), investigating recurrent abortions and infertility, and detecting oncogenic translocations (Philadelphia chromosome in CML).","Karyotype: arrangement of interphase chromatin by staining intensity. Utility: diagnosis of lysosomal storage diseases and detection of mitochondrial DNA mutations.","Karyotype: photograph of the nucleolus during prophase. Utility: counting ribosomes and diagnosing ribosomal defects.","Karyotype: arrangement of metaphase chromosomes by size. Utility: only the determination of the sex of the fetus; it cannot detect numerical or structural anomalies."]
]},
{t:"Ch 5: Cell Cycle, Apoptosis & Cell Death",q:[
["Which phase of the eukaryotic cell cycle is characterized by cell growth, protein synthesis, and represents the longest phase?","Gap 1 (G1) phase","Synthesis (S) phase","Gap 2 (G2) phase","Mitosis (M) phase"],
["During which phase of the cell cycle does DNA replication, histone protein synthesis, and centrosome duplication occur?","S phase","G1 phase","G2 phase","G0 phase"],
["The permanent or temporary state of cellular differentiation where cells suspend active progression through the cell cycle is designated:","G0 phase","G2 phase","M phase","S phase"],
["Progression between cell cycle phases is driven and regulated by a specialized family of cytoplasmic proteins termed:","Cyclins","Actins","Tubulins","Lamins"],
["At which specific checkpoint does the cell evaluate whether all chromosomes are properly attached to the mitotic spindle before chromatid separation?","Metaphase / Anaphase checkpoint","G1 / S checkpoint","G2 / M checkpoint","G0 exit checkpoint"],
["Which of the following morphological features is a defining hallmark of physiological apoptosis?","Cell shrinkage, membrane blebbing, and formation of apoptotic bodies","Cellular swelling and early cell membrane rupture","Massive induction of acute neutrophilic inflammation","Uncontrolled spillage of lytic contents into the extracellular matrix"],
["A major functional difference between apoptosis and necrosis is that necrosis:","Is always pathological, induces cellular swelling, membrane rupture, and acute inflammation","Is a physiological, highly programmed process","Maintains intact cell membranes throughout phagocytosis","Is essential for shaping embryological digits during organ development"],
["Which of the following represents a normal physiological role of apoptosis during embryonic development?","Digital separation (formation of distinct fingers and toes) in the embryo","Fibrotic scarring following a myocardial infarction","Uncontrolled proliferation of malignant squamous cells","Hypertrophy of vascular smooth muscle cells in hypertension"],
["What happens to a dividing cell at a cell cycle checkpoint if DNA damage cannot be successfully repaired?","It is directed to undergo apoptosis to protect tissue integrity","It immediately transforms into a pluripotent stem cell","It proceeds directly into anaphase without division","It permanently remains in S phase while continuing centrosome multiplication"],
["Which of the following cellular events occurs during the short G2 phase of the cell cycle?","Accumulation of proteins and tubulins required for mitosis","Duplication of chromosomal DNA","Phagocytosis of apoptotic bodies","Terminal exit into permanent differentiation"],
["The regular, orderly sequence of events by which a cell duplicates its content and divides to produce new cells is termed the "+B+".","cell cycle","mitosis","cell renewal","cell differentiation"],
["The four sequential phases composing the active cell cycle, in chronological order, are "+B+", "+B+", "+B+", and "+B+".","G1, S, G2, M","G1, G2, S, M","S, G1, G2, M","G0, G1, S, M"],
["Cellular signals that stimulate a quiescent cell to enter and initiate the cell cycle from outside are called "+B+".","growth factors","cyclins","checkpoints","cytochrome c"],
["Terminally differentiated cells that permanently exit the cell cycle and can never divide again include cardiac myocytes and "+B+".","nerve cells (neurons)","hepatocytes","smooth muscle cells","skin keratinocytes"],
["At the G2/M checkpoint, the cell strictly verifies whether "+B+" is completely and accurately replicated before initiating mitosis.","DNA","spindle attachment","cell size","centrosome position"],
["Cell death is defined as the permanent cessation of cell vital functions and loss of its "+B+".","structural integrity","capacity to divide","genetic information","nuclear envelope"],
["The two primary forms of cell death in human biology are "+B+" and "+B+".","Apoptosis and Necrosis","Apoptosis and Mitosis","Necrosis and Autolysis","Apoptosis and Phagocytosis"],
["Unlike necrosis, physiological apoptosis does not induce "+B+" in surrounding tissues.","inflammation","cell shrinkage","DNA fragmentation","phagocytosis"],
["Late in apoptosis, the breaking of the cell into small, membrane-bound fragments creates "+B+".","apoptotic bodies","residual bodies","lysosomes","secretory granules"],
["At the G1/S checkpoint (Start checkpoint), the cell assesses whether cell size, nutrients, and environment are favorable and whether "+B+" is intact.","DNA","spindle","centrosome","cyclins"],
["Matching: G1 Phase:","Longest period; cell growth, protein synthesis, and preparation for DNA replication","Doubling of genomic DNA, centrosome replication, and histone synthesis","Short gap phase accumulating mitotic proteins and preparing for cell division","Quiescent differentiation state; cell cycle activities are temporarily or permanently suspended"],
["Matching: S Phase:","Doubling of genomic DNA, centrosome replication, and histone synthesis","Longest period; cell growth, protein synthesis, and preparation for DNA replication","Short gap phase accumulating mitotic proteins and preparing for cell division","Physiological programmed cell death with shrinkage, blebbing, and no inflammation"],
["Matching: G2 Phase:","Short gap phase accumulating mitotic proteins and preparing for cell division","Quiescent differentiation state; cell cycle activities are temporarily or permanently suspended","Doubling of genomic DNA, centrosome replication, and histone synthesis","Longest period; cell growth, protein synthesis, and preparation for DNA replication"],
["Matching: G0 Phase:","Quiescent differentiation state; cell cycle activities are temporarily or permanently suspended","Short gap phase accumulating mitotic proteins and preparing for cell division","Longest period; cell growth, protein synthesis, and preparation for DNA replication","Pathological acute cell injury resulting in cellular swelling, rupture, and inflammation"],
["Matching: Apoptosis:","Physiological programmed cell death with shrinkage, blebbing, and no inflammation","Pathological acute cell injury resulting in cellular swelling, rupture, and inflammation","Quiescent differentiation state; cell cycle activities are temporarily or permanently suspended","Doubling of genomic DNA, centrosome replication, and histone synthesis"],
["Matching: Necrosis:","Pathological acute cell injury resulting in cellular swelling, rupture, and inflammation","Physiological programmed cell death with shrinkage, blebbing, and no inflammation","Short gap phase accumulating mitotic proteins and preparing for cell division","Longest period; cell growth, protein synthesis, and preparation for DNA replication"],
["Tabulate a comparison between Apoptosis and Necrosis (nature, cell volume, plasma membrane, inflammation, biological role).","Apoptosis: physiological programmed process, cell shrinkage, membrane blebbing into apoptotic bodies, no inflammation, homeostatic pruning. Necrosis: pathological acute injury, cell swelling and lysis, early membrane rupture, intense acute inflammation, destructive to tissue.","Apoptosis: pathological process, cell swelling, early membrane rupture, intense inflammation. Necrosis: physiological process, cell shrinkage, apoptotic bodies, no inflammation.","Apoptosis: physiological, cell swelling, membrane rupture, no inflammation. Necrosis: pathological, cell shrinkage, membrane blebbing, acute inflammation.","Apoptosis: physiological, cell shrinkage, apoptotic bodies, marked neutrophilic inflammation. Necrosis: pathological, cell swelling, intact membrane, no inflammation."],
["List the sequential stages and structural events characterizing Apoptosis.","(1) Signaling via mitochondrial cytochrome c release or death receptors. (2) Endonuclease activation with DNA fragmentation. (3) Cytoplasmic dehydration and cell shrinkage. (4) Membrane blebbing into apoptotic bodies. (5) Silent phagocytosis by macrophages.","(1) Cell swelling and organelle dilatation. (2) Rupture of the plasma membrane. (3) Release of lytic enzymes. (4) Acute neutrophilic inflammation. (5) Scar formation.","(1) DNA replication. (2) Centrosome duplication. (3) Spindle assembly. (4) Chromatid separation. (5) Cytokinesis.","(1) Membrane blebbing into apoptotic bodies. (2) Release of cytochrome c. (3) Cell swelling. (4) Phagocytosis by neutrophils. (5) Endonuclease activation."],
["Describe the biological significance of apoptosis, citing clinical relevance to carcinogenesis.","Essential for embryonic morphogenesis (interdigital separation), lumen formation and immune tolerance. Defective apoptosis lets mutated, DNA-damaged cells escape destruction and leads to carcinogenesis (e.g., loss of p53 tumor suppressor activity).","Apoptosis only removes necrotic cells after injury and has no role in development; cancer arises from excessive apoptosis of normal cells.","Apoptosis is important for scar formation after infarction; excessive apoptosis of mutated cells leads to carcinogenesis through p53 activation.","Apoptosis shapes the embryo and its loss causes necrosis of tumor cells, which prevents cancer spread."],
["List the phases of the active cell cycle in chronological order, stating the major structural event in each phase.","G1: cell growth, RNA and protein synthesis. S: DNA replication, histone synthesis, centrosome duplication. G2: accumulation of mitotic tubulin and checkpoint verification. M: karyokinesis and cytokinesis.","G1: DNA replication and histone synthesis. S: cell growth and protein synthesis. G2: centrosome duplication. M: karyokinesis and cytokinesis.","G1: accumulation of mitotic tubulin. S: cell growth. G2: DNA replication and centrosome duplication. M: cell differentiation.","G0: cell growth. G1: DNA replication. S: mitotic tubulin accumulation. M: karyokinesis and cytokinesis."],
["Explain the physiological importance of cell cycle checkpoints and the criteria evaluated at the G1/S and G2/M checkpoints.","Checkpoints prevent progression until the previous phase is complete. G1/S (Start): cell size, nutrients, extracellular mitogens and DNA integrity. G2/M: DNA replication is complete and accurate before spindle construction.","Checkpoints speed up the cycle. G1/S: confirms that chromosomes are attached to the spindle. G2/M: confirms cell size and nutrient supply.","Checkpoints trigger necrosis of damaged cells. G1/S: DNA replication is complete. G2/M: centrosomes have separated to opposite poles.","Checkpoints keep the cell in G0 permanently. G1/S: histone synthesis. G2/M: cyclin degradation."]
]},
{t:"Ch 6: Stem Cells & Tissue Renewal",q:[
["Stem cells are scientifically defined as:","Undifferentiated cells possessing the potential to develop into multiple differentiated cell types","Terminally differentiated cells that have permanently lost the ability to divide","Pathological multinucleated cells formed exclusively during tissue necrosis","Mature epithelial cells specialized in holocrine secretion"],
["The property of stem cell division wherein one daughter cell remains an undifferentiated stem cell while the other commits to a differentiation lineage is called:","Asymmetric replication","Symmetrical binary fission","Synchronous amitosis","Polyploid duplication"],
["Which of the following adult tissues represents a rich clinical source of adult stem cells used in regenerative therapy?","Bone marrow and adipose tissue","Central core of cardiac muscle","Grey matter of the cerebral cortex","Mature red blood cells"],
["Rapidly renewing (continuously dividing) tissues are exemplified by:","Epithelial lining of the gastrointestinal tract and epidermis","Adult neurons of the spinal cord","Vascular smooth muscle and hepatocytes","Cardiac ventricular myocytes"],
["Stable tissues are characterized by cells that normally reside in G0 phase but can vigorously re-enter the cell cycle following injury. A classic example is:","Liver hepatocytes","Skeletal muscle fibers","Cardiac myocytes","Cerebellar Purkinje neurons"],
["Permanent tissues have virtually no proliferative capacity; injury to these tissues results in permanent tissue loss and scarring. Permanent tissues include:","Nerve cells and cardiac muscle cells","Epidermis of the skin","Lining of renal tubules","Blood-forming hematopoietic tissue"],
["Stem cells divide infrequently in their physiological niches primarily to:","Minimize the risk of replication-associated DNA mutations","Prevent energy depletion within the extracellular matrix","Allow rapid apoptosis of adjacent cells","Convert directly into connective tissue fibers"],
["During tissue repair of a stable tissue like the liver, newly formed functional hepatocytes arise through:","Re-entry of surviving differentiated hepatocytes from G0 back into the active cell cycle","Immigration of epidermal keratinocytes","Direct transformation of mature erythrocytes","Fusion of dead necrotic fragments"],
["Stem cells isolated directly from the inner cell mass of the early embryo are termed "+B+" stem cells.","embryonic","adult (somatic)","hematopoietic","mesenchymal"],
["The inherent ability of stem cells to divide repeatedly while retaining an undifferentiated pool is known as "+B+".","self-renewal capacity","differentiation","transdifferentiation","terminal differentiation"],
["Compared to transit-amplifying cells, true quiescent stem cells undergo "+B+" cell division.","infrequent (slow)","frequent (rapid)","symmetric-only","amitotic"],
["The continuous physiological process by which lost or damaged cells are replaced by newly proliferated cells is defined as "+B+".","tissue renewal","cell differentiation","hypertrophy","metaplasia"],
["Tissues are classified based on their proliferative renewal capacity into rapidly renewing, stable, and "+B+" tissues.","permanent","labile","terminal","embryonic"],
["Injury to permanent tissues results in permanent functional deficit because they contain almost no resident "+B+".","stem cells","fibroblasts","macrophages","endothelial cells"],
["In rapidly renewing tissues, new replacement cells are generated by continuously dividing "+B+".","stem cells","terminally differentiated cells","fibroblasts","satellite cells"],
["The new medical field aiming to restore diseased organs using stem cell therapy is called "+B+".","regenerative medicine (stem cell therapy)","gene therapy","immunotherapy","tissue engineering"],
["Matching: Rapidly Renewing Tissues:","Epidermis of skin and gastrointestinal epithelium; continuous rapid turnover via stem cells","Liver hepatocytes and vascular smooth muscle; normally in G0 but re-enter cycle on demand","Cardiac myocytes and neurons; terminally differentiated, cannot regenerate","Multipotent cells residing in adult niches like bone marrow and adipose tissue"],
["Matching: Stable Tissues:","Liver hepatocytes and vascular smooth muscle; normally in G0 but re-enter cycle on demand","Epidermis of skin and gastrointestinal epithelium; continuous rapid turnover via stem cells","Cardiac myocytes and neurons; terminally differentiated, cannot regenerate","Pluripotent cells isolated from the inner cell mass of the early embryo"],
["Matching: Permanent Tissues:","Cardiac myocytes and neurons; terminally differentiated, cannot regenerate","Liver hepatocytes and vascular smooth muscle; normally in G0 but re-enter cycle on demand","Epidermis of skin and gastrointestinal epithelium; continuous rapid turnover via stem cells","Multipotent cells residing in adult niches like bone marrow and adipose tissue"],
["Matching: Embryonic Stem Cells:","Pluripotent cells isolated from the inner cell mass of the early embryo","Multipotent cells residing in adult niches like bone marrow and adipose tissue","Cardiac myocytes and neurons; terminally differentiated, cannot regenerate","Liver hepatocytes and vascular smooth muscle; normally in G0 but re-enter cycle on demand"],
["Matching: Adult Stem Cells:","Multipotent cells residing in adult niches like bone marrow and adipose tissue","Pluripotent cells isolated from the inner cell mass of the early embryo","Epidermis of skin and gastrointestinal epithelium; continuous rapid turnover via stem cells","Cardiac myocytes and neurons; terminally differentiated, cannot regenerate"],
["Enumerate the four essential distinguishing characteristics of stem cells.","(1) Undifferentiated. (2) Self-renewal. (3) Infrequent division. (4) Asymmetric division yielding a stem cell and a differentiated transit cell.","(1) Terminally differentiated. (2) Self-renewal. (3) Rapid division. (4) Symmetric division yielding two differentiated cells.","(1) Undifferentiated. (2) Permanent exit to G0. (3) Frequent division. (4) Asymmetric division yielding two stem cells.","(1) Differentiated. (2) Self-renewal. (3) Infrequent division. (4) Amitotic division."],
["Classify human tissues according to their proliferative and tissue-renewal capacity, giving two examples for each class.","(1) Rapidly renewing: intestinal epithelium, epidermis. (2) Stable: hepatocytes, renal tubular cells. (3) Permanent: cardiac muscle, CNS neurons.","(1) Rapidly renewing: hepatocytes, renal tubular cells. (2) Stable: intestinal epithelium, epidermis. (3) Permanent: cardiac muscle, neurons.","(1) Rapidly renewing: cardiac muscle, neurons. (2) Stable: hepatocytes, renal tubules. (3) Permanent: epidermis, intestinal epithelium.","(1) Rapidly renewing: epidermis, neurons. (2) Stable: cardiac muscle, hepatocytes. (3) Permanent: intestinal epithelium, renal tubules."],
["Discuss the medical significance of stem cells in modern regenerative medicine and clinical therapy.","Stem cell transplantation replaces diseased or lost cells in neurodegenerative diseases (Parkinson's), acute myocardial infarction, diabetes (islet regeneration) and bone marrow reconstitution after chemotherapy.","Stem cells are used only to produce antibodies against tumors, and have no role in replacing lost cells.","Stem cells are used only for karyotyping, to detect numerical chromosomal anomalies in the fetus.","Stem cells are used to stimulate apoptosis in permanent tissues so that they can regenerate."],
["Explain what is meant by 'Asymmetric Replication' and why it is essential for tissue homeostasis.","One stem cell divides into one identical undifferentiated stem cell (preserving the niche reserve) and one committed transit-amplifying progenitor that goes on to terminal differentiation, balancing cell maintenance with tissue generation.","One stem cell divides into two identical stem cells, which increases the stem cell pool and causes tissue hyperplasia.","One stem cell divides into two committed progenitors, which exhausts the stem cell pool but speeds up renewal.","A differentiated cell divides into one stem cell and one apoptotic body, which removes damaged cells."]
]},
{t:"Ch 7: General Characters of Epithelium & Basement Membrane",q:[
["Which of the following is a fundamental general characteristic of all epithelial tissues?","Closely aggregated cells with minimal intervening extracellular matrix","Abundant extracellular matrix separating widely scattered cells","Rich direct capillary network penetrating between adjacent epithelial cells","Absence of any underlying basement membrane"],
["Epithelial tissues are avascular (lack intrinsic blood vessels). They receive their oxygen and essential nutrients through:","Diffusion from capillary plexuses located within the underlying connective tissue across the basement membrane","Direct phagocytosis of circulating erythrocytes","Active pinocytosis from adjacent muscular tissue only","Specialized gas-secreting vesicles located within apical cilia"],
["While epithelia are strictly avascular, they possess a rich nerve supply consisting of:","Unmyelinated nerve endings that penetrate the basement membrane to mediate sensation","Myelinated axon bundles penetrating all surface layers","Complete absence of sensory or autonomic nerve endings","Efferent motor end-plates situated within the cell glycocalyx"],
["The basement membrane separating an epithelium from underlying connective tissue is visualized under light microscopy using:","Periodic acid–Schiff (PAS) and silver impregnation techniques","Standard H&E (staining deeply basophilic)","Janus green B vital stain","Toluidine blue at pH 1.0"],
["Under electron microscopy, the basement membrane is resolved into two distinct layers:","Basal lamina (produced by epithelial cells) and reticular lamina (produced by connective tissue fibroblasts)","Zonula occludens and zonula adherens","Inner mitochondrial membrane and outer matrix membrane","Trilaminar unit membrane and apical glycocalyx"],
["Which of the following intermediate filament proteins is specifically characteristic of epithelial cells and used in pathology to diagnose carcinomas?","Cytokeratin","Desmin","Vimentin","Neurofilament"],
["The histological assessment of the basement membrane is of paramount diagnostic and prognostic significance in oncology because:","An intact basement membrane confines the tumor (carcinoma in situ); once invaded, malignant cells gain access to blood and lymphatics","Carcinoma in situ is defined by cancer cells that have breached the basement membrane","Basement membrane dissolution stimulates instant necrosis of the tumor mass","Benign tumors always destroy the basement membrane completely"],
["Why do full-thickness skin burns require surgical skin grafting, unlike partial-thickness burns?","Full-thickness burns destroy the basement membrane scaffold and epidermal stem cell niches, abolishing natural regeneration","Keratinocytes in deep burns multiply too rapidly and cause tumor formation","Connective tissue fibroblasts refuse to produce collagen fibrils","Endothelial cells permanently seal all capillaries in the body"],
["The human body is composed of four basic primary tissues: epithelial, connective, muscular, and "+B+" tissue.","nervous","glandular","adipose","lymphoid"],
["Epithelium is an "+B+" tissue, meaning it contains no intrinsic blood vessels.","avascular","vascular","acellular","aneural"],
["The basal aspect of all epithelial sheets rests upon an extracellular sheet termed the "+B+".","basement membrane","basal lamina only","reticular lamina","glycocalyx"],
["The basal lamina is synthesized and secreted by the "+B+" cells, whereas the reticular lamina is secreted by "+B+".","epithelial / connective tissue fibroblasts","connective tissue fibroblasts / epithelial cells","epithelial cells / epithelial cells","epithelial cells / macrophages"],
["The argyrophilic fibers present within the reticular lamina that stain black with silver impregnation are "+B+" fibers.","reticular","elastic","collagen type I","oxytalan"],
["Basement membrane serves as a physical "+B+" (scaffold) that guides epithelial cell migration during re-epithelialization following injury.","scaffold","filter","anchor","barrier"],
["Severe deep burns that destroy the "+B+" prevent natural epithelial regeneration, necessitating skin grafting.","basement membrane","stratum corneum","papillary dermis","keratinocytes"],
["A localized epithelial malignancy that has not yet penetrated the underlying basement membrane is clinically termed carcinoma "+B+".","in situ","invasive","metastatic","intraepithelial"],
["Matching: Basal Lamina:","Epithelial-derived layer rich in laminin and type IV collagen; PAS-positive","Fibroblast-derived layer rich in reticular fibers; stains with silver stain","Free nerve endings penetrate between epithelial cells providing sensory reception","Epithelial-specific intermediate filaments providing structural resilience"],
["Matching: Reticular Lamina:","Fibroblast-derived layer rich in reticular fibers; stains with silver stain","Epithelial-derived layer rich in laminin and type IV collagen; PAS-positive","Epithelial feature requiring nutrient diffusion from the vascularized connective tissue","Epithelial-specific intermediate filaments providing structural resilience"],
["Matching: Avascularity:","Epithelial feature requiring nutrient diffusion from the vascularized connective tissue","Free nerve endings penetrate between epithelial cells providing sensory reception","Fibroblast-derived layer rich in reticular fibers; stains with silver stain","Epithelial-derived layer rich in laminin and type IV collagen; PAS-positive"],
["Matching: Rich Innervation:","Free nerve endings penetrate between epithelial cells providing sensory reception","Epithelial feature requiring nutrient diffusion from the vascularized connective tissue","Epithelial-specific intermediate filaments providing structural resilience","Fibroblast-derived layer rich in reticular fibers; stains with silver stain"],
["Matching: Cytokeratins:","Epithelial-specific intermediate filaments providing structural resilience","Free nerve endings penetrate between epithelial cells providing sensory reception","Epithelial-derived layer rich in laminin and type IV collagen; PAS-positive","Epithelial feature requiring nutrient diffusion from the vascularized connective tissue"],
["Enumerate six general histological characteristics of epithelial tissue.","(1) High cellularity with minimal extracellular matrix. (2) Cellular polarity. (3) Basal surface rests on a basement membrane. (4) Avascularity. (5) Rich sensory innervation. (6) High mitotic regenerative capacity.","(1) Abundant extracellular matrix. (2) Cellular polarity. (3) Rests on a basement membrane. (4) Rich capillary network. (5) No innervation. (6) Permanent non-dividing tissue.","(1) High cellularity. (2) No polarity. (3) Rests on a basement membrane. (4) Avascularity. (5) No innervation. (6) High regenerative capacity.","(1) Minimal matrix. (2) Cellular polarity. (3) No basement membrane. (4) Avascularity. (5) Rich innervation. (6) Low regenerative capacity."],
["Describe the light and electron microscopic structure of the basement membrane, and list its special stains.","LM: thin line stained magenta with PAS (glycoproteins) and black with silver (reticular fibers). EM: basal lamina (secreted by epithelial cells; type IV collagen, laminin, perlecan) and reticular lamina (secreted by fibroblasts; type III collagen reticular fibers).","LM: stained deep blue with hematoxylin and pink with eosin. EM: basal lamina secreted by fibroblasts and reticular lamina secreted by epithelial cells.","LM: thin line stained black with Sudan Black. EM: a single trilaminar membrane made of phospholipids.","LM: stained magenta with PAS only. EM: zonula occludens and zonula adherens layers made of type I collagen."],
["Enumerate the key functions of the basement membrane and explain its clinical significance in burns and cancer invasion.","Functions: structural attachment, semipermeable molecular sieve, migration scaffold. Superficial burns spare the BM and heal; full-thickness burns destroy it and need grafting. Carcinoma in situ has intact BM; breaching it marks invasive carcinoma with metastatic potential.","Functions: secretion of mucus and absorption. Burns: full-thickness burns heal by re-epithelialization. Cancer: breaching the BM marks carcinoma in situ, which is curable.","Functions: contraction and sensory reception. Burns: superficial burns destroy the BM and need grafting. Cancer: an intact BM allows metastasis.","Functions: synthesis of keratin and nutrient supply through its own capillaries. Burns: BM is never damaged. Cancer: BM breakdown stops tumor spread."],
["Explain how avascular epithelial cells receive oxygen and nutrients, and describe the role of underlying connective tissue.","They depend on diffusion of oxygen and nutrients from capillary plexuses in the underlying vascularized connective tissue (lamina propria), crossing the permeable basement membrane.","They receive blood from capillaries running between epithelial cells, with the connective tissue giving only mechanical support.","They obtain nutrients by phagocytosis of red cells from the lumen, with connective tissue producing the matrix only.","They receive nutrients through gap junctions from nerve endings that penetrate the basement membrane."]
]},
{t:"Ch 8: Intercellular Junctions & Apical Specializations",q:[
["Which type of intercellular junction is located at the most apical aspect of the lateral epithelial membrane and forms an impermeable seal preventing paracellular diffusion?","Tight junction (zonula occludens)","Zonula adherens","Macula adherens (desmosome)","Gap junction (nexus)"],
["Zonula adherens junctions form a continuous belt around the cell below the tight junction and are anchored intracellularly to:","Microfilaments (actin filaments)","Intermediate filaments (cytokeratins)","Microtubule triplets","Collagen type IV fibers"],
["Desmosomes (maculae adherentes) provide spot-like, very strong mechanical adhesion between adjacent epithelial cells and are anchored intracellularly to:","Intermediate filaments (keratin tonofilaments)","Actin microfilaments","Microtubule singlets","Dynein motor arms"],
["The specialized anchoring junctions that bind the basal plasma membrane of epithelial cells to the underlying basement membrane are:","Hemidesmosomes","Tight junctions","Zonulae adherentes","Gap junctions"],
["Direct cell-to-cell communication and rapid transfer of inorganic ions and second messengers between adjacent cells occur via:","Gap junctions (communicating junctions)","Tight junctions","Desmosomes","Hemidesmosomes"],
["The core of an intestinal microvillus is structurally composed of a bundle of:","Actin microfilaments","Axonemal microtubules arranged in a 9+2 pattern","Centriolar microtubule triplets","Neurofilaments and dynein arms"],
["Stereocilia, found lining the epididymis and hair cells of the inner ear, are best described structurally as:","Extremely long, branching, non-motile microvilli with an actin filament core","Actively beating cilia with a 9+2 axoneme","Modified flagella containing dynein arms","Thick folds of the basement membrane containing collagen fibrils"],
["The axoneme of a motile cilium has an internal microtubule arrangement of:","9 peripheral doublets surrounding 2 central single microtubules (9x2 + 2 = 20)","9 peripheral triplets with no central tubules (9x3 + 0 = 27)","9 central singlets and 2 peripheral triplets","A random scaffold of intermediate keratin fibrils"],
["The basal body anchoring the base of each cilium in the apical cytoplasm is structurally homologous to a centriole, consisting of:","9 peripheral microtubule triplets (9x3 = 27 microtubules)","9 peripheral microtubule doublets and 2 central singlets (20 tubules)","A dense bundle of actin microfilaments","A solid core of laminin and type IV collagen"],
["A patient presents with recurrent chronic sinusitis, bronchiectasis, and male infertility. Electron microscopy of respiratory epithelium reveals absent dynein arms in ciliary axonemes. This condition is diagnosed as:","Immotile cilia syndrome (Kartagener's syndrome)","Lysosomal storage disease","Ehlers-Danlos syndrome","Epidermolysis bullosa"],
["Which of the following apical surface specializations possesses active directional motility?","Cilia","Microvilli","Stereocilia","Basal lamina folds"],
["In cardiac muscle and epithelial sheets, gap junctions coordinate synchronous functional responses by transferring:","Inorganic ions and electrical impulses","Intact secretory vesicles","Entire chromatin strands","Bundles of intermediate filaments"],
["Intercellular junctions on the lateral epithelial surface provide three major functions: sealing, adhesion, and "+B+".","communication","absorption","secretion","motility"],

["Tabulate a comparison between Microvilli, Stereocilia, and Cilia (length, motility, core, site, function).","Microvilli: ~1 µm, non-motile, actin core, small intestine, increase absorptive surface. Stereocilia: up to 50 µm, non-motile, branching actin core, epididymis/inner ear, absorption and sensory transduction. Cilia: 5–10 µm, motile, 9x2+2 axoneme, respiratory tract and oviduct, sweep mucus and fluids.","Microvilli: ~1 µm, motile, 9x2+2 axoneme, respiratory tract. Stereocilia: up to 50 µm, non-motile, actin core, epididymis. Cilia: 5–10 µm, non-motile, actin core, small intestine, absorption.","Microvilli: 5–10 µm, non-motile, microtubule core, small intestine. Stereocilia: ~1 µm, motile, actin core, epididymis. Cilia: up to 50 µm, motile, 9x2+2 axoneme, oviduct.","Microvilli: ~1 µm, non-motile, actin core, small intestine. Stereocilia: up to 50 µm, motile, microtubule core, epididymis. Cilia: 5–10 µm, non-motile, intermediate filament core, trachea."],
["Enumerate the types of intercellular junctions on the lateral and basal surfaces of epithelial cells, stating the function of each.","(1) Tight junction: apical sealing belt preventing paracellular flow. (2) Zonula adherens: actin-anchored adhesion belt. (3) Desmosome: spot weld attached to keratin filaments. (4) Hemidesmosome: anchors basal membrane to the basement membrane. (5) Gap junction: connexon channels for direct communication.","(1) Tight junction: communication channels. (2) Zonula adherens: apical seal. (3) Desmosome: attached to actin filaments. (4) Hemidesmosome: joins adjacent cells. (5) Gap junction: sealing.","(1) Tight junction: apical sealing belt. (2) Zonula adherens: attached to intermediate filaments. (3) Desmosome: attached to actin. (4) Hemidesmosome: anchors cells to each other. (5) Gap junction: attachment to the basement membrane.","(1) Tight junction: attachment to the basement membrane. (2) Zonula adherens: spot weld. (3) Desmosome: apical sealing belt. (4) Hemidesmosome: communication channels. (5) Gap junction: actin-anchored belt."],
["Describe the molecular pathogenesis and clinical manifestations of Immotile Cilia Syndrome.","Genetic defect causing absence of ciliary dynein arms, which abolishes ciliary motility. Manifestations: chronic sinusitis and bronchiectasis (mucociliary stasis), male infertility (immotile sperm), and often dextrocardia/situs inversus (Kartagener's syndrome).","Genetic defect causing absence of tubulin in the basal body, which abolishes mitosis. Manifestations: chronic diarrhea and malabsorption, with female infertility.","Defective tight junctions causing leakage of mucus into the lumen. Manifestations: recurrent urinary tract infections and intestinal obstruction.","Absence of dynein arms in microvilli causing loss of absorption. Manifestations: malabsorption, steatorrhea and hearing loss."],

var D=L.map(function(c){return{title:c.t,qs:c.q.map(function(x){return{q:x[0],o:x.slice(1),a:0}})}});
var app=document.getElementById("app"),S={};
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function home(){
  var h='<div class="hero"><h1>امتحان الهستولوجي</h1><p>عايز تمتحن على أنهي محاضرة؟</p></div><div class="grid">';
  D.forEach(function(Lc,i){h+='<button class="lec" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span><b>'+esc(Lc.title)+'</b><small>'+Lc.qs.length+' سؤال في البنك - 12 سؤال عشوائي في كل مرة</small></span></button>'});
  app.innerHTML=h+'</div>';
  app.querySelectorAll(".lec").forEach(function(b){b.onclick=function(){start(+b.dataset.i)}});
  window.scrollTo(0,0);
}
function start(i){
  var qs=shuf(D[i].qs).slice(0,12).map(function(q){
    var idx=shuf(q.o.map(function(_,k){return k}));
    return{q:q.q,o:idx.map(function(k){return q.o[k]}),a:idx.indexOf(q.a)}});
  S={i:i,qs:qs,n:0,score:0,miss:[],done:false};show();
}
function show(){
  var q=S.qs[S.n],tot=S.qs.length;
  var h='<div class="bar"><button class="back" id="bk">رجوع</button><div class="prog"><i style="width:'+(S.n/tot*100)+'%"></i></div><span class="cnt">'+(S.n+1)+' / '+tot+'</span></div>';
  h+='<div class="card"><div class="ltitle">'+esc(D[S.i].title)+'</div><p class="q">'+esc(q.q)+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'"><span class="l">'+"abcd"[k]+'</span><span>'+esc(o)+'</span></button>'});
  h+='</div><div id="fb"></div></div>';
  app.innerHTML=h;
  document.getElementById("bk").onclick=function(){if(confirm("تخرج من الامتحان؟"))home()};
  app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}});
  window.scrollTo(0,0);
}
function pick(k){
  var q=S.qs[S.n],bs=app.querySelectorAll(".opt");
  bs.forEach(function(b,j){b.disabled=true;if(j===q.a)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
  var fb=document.getElementById("fb"),h="";
  if(k===q.a)S.score++;else{S.miss.push({q:q.q,a:q.o[q.a]})}
  var last=S.n===S.qs.length-1;
  h+='<button class="btn" id="nx">'+(last?"شوف النتيجة":"السؤال اللي بعده")+'</button>';
  fb.innerHTML=h;
  document.getElementById("nx").onclick=function(){if(last)result();else{S.n++;show()}};
}
function result(){
  var t=S.qs.length,p=Math.round(S.score/t*100);
  var msg=p>=85?"ممتاز! كمّل كده":p>=60?"كويس، راجع الغلطات وهتبقى تمام":"محتاج مراجعة تانية للمحاضرة دي";
  var h='<div class="card score"><div class="ltitle">'+esc(D[S.i].title)+'</div><div class="big">'+S.score+' / '+t+'</div><p>'+msg+'</p></div>';
  if(S.miss.length){h+='<div class="rev"><b>الأسئلة اللي غلطت فيها:</b>';S.miss.forEach(function(m){h+='<div class="r">'+esc(m.q)+'<br><em>'+esc(m.a)+'</em></div>'});h+='</div>'}
  h+='<button class="btn" id="again">12 سؤال عشوائي جداد من نفس المحاضرة</button><button class="btn alt" id="hm">رجوع للمحاضرات</button>';
  app.innerHTML=h;
  document.getElementById("again").onclick=function(){start(S.i)};
  document.getElementById("hm").onclick=home;
  window.scrollTo(0,0);
}
home();
</script>
